# /usr/share/logstash/pipeline/cyberrange.conf
# 接收 Beats lumberjack input,寫進 incoming-YYYY.MM.dd 與 filebeat 同 index。

input {
  beats {
    port => 5044
    # 暫不啟用 SSL — 內網 lab。production 化要加 ssl_enabled + cert/key。
  }
}

filter {
  # 跟 filebeat 的 strip_priority processor 對齊:拿掉 RFC3164 PRI 前綴 <NNN>
  if [message] =~ /^<\d+>/ {
    mutate {
      gsub => ["message", "^<\d+>", ""]
    }
  }

  # 標記是 logstash 來的,方便 debug 兩條入口
  mutate {
    add_field => { "[event][ingest_path]" => "logstash-beats" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user  => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "incoming-%{+yyyy.MM.dd}"
    # 不指定 template / ILM,跟 filebeat 預設一致
  }

  # 開發期間如果想 debug 可以打開:
  # stdout { codec => rubydebug }
}
