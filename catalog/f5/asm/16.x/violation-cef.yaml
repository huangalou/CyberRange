  sigma:
    - rule: f5_asm_violation_cef
      ref: https://github.com/SigmaHQ/sigma  # community contrib pending
  elk_detection:
    - kibana_rule_id: f5-asm-cef-attack-blocked
      severity: high
    - kibana_rule_id: f5-asm-cef-high-rating-unblocked
      severity: critical

mythos_alignment:
  risk_refs: [R1, R4]
  pa_refs: [PA1]
  ttx_class: rapid

regression:
  # 1000 events with 6 attack_types × 2 軸 × 2 act(blocked/alerted)
  # covers all 32 rules. Mass-blocked aggregation (130015/130070)
  # needs >= 5 blocked events on the same dst within 1 min — fanout=5
  # protected_dest_pool keeps this dense (same as native sibling).
  baseline_alert_count: 1000
  baseline_ttd_ms: 3000

params:
  unit_hostname:
    default: "bigip-asm-lab-01"
  dvchost_fqdn:
    default: "bigip-asm-lab-01.lab.local"
  device_id:
    default: "0"   # numeric ASM device id (cn3 is Long-typed in ArcSight); FQDN lives in dvchost
  policy_name:
    default: "/Common/asm_blocking_policy_prod"
  web_application_name:
    default: "/Common/asm_blocking_policy_prod"
  management_ip_address:
    default: "10.0.30.10"
  # External attackers — drives 外部主機 axis rules
  external_attacker_pool:
    default:
      - "203.0.113.45"
      - "198.51.100.77"
      - "45.142.213.18"
      - "194.165.16.99"
      - "172.93.179.115"
  # Internal sources — drives 內部主機 axis rules
  internal_source_pool:
    default: "10.0.20.0/24"
  # Protected web servers behind the WAF
  protected_dest_pool:
    default:
      - "10.0.50.10"
      - "10.0.50.11"
      - "10.0.50.12"
      - "10.0.50.13"
      - "10.0.50.14"

fields:
  - name: pri
    type: fixed
    value: 134   # local0.info — F5 ASM default facility/severity

  - name: rfc3164_ts
    type: datetime
    format: "%b %d %H:%M:%S"

  # CEF `rt` extension and `deviceCustomDate1` format — ArcSight
  # canonical "MMM dd yyyy HH:mm:ss" (matches every verbatim F5
  # sample from the ArcSight Certified Guide).
  - name: cef_rt
    type: datetime
    format: "%b %d %Y %H:%M:%S"

  - name: policy_apply_date_cef
    type: fixed
    value: "Apr 15 2026 09:30:12"

  # src_zone drives 內 vs 外 axis. 60% external (typical perimeter
  # exposure), 40% internal (insider threat / pivoted-attacker scenarios).
  - name: src_zone
    type: weighted_choice
    choices:
      external: 0.60
      internal: 0.40

  - name: external_src
    type: choice
    choices: ${params.external_attacker_pool}

  - name: internal_src
    type: cidr
    cidr: ${params.internal_source_pool}

  - name: client_ip
    type: template
    template: "{% if src_zone == 'external' %}{{external_src}}{% else %}{{internal_src}}{% endif %}"

  - name: server_ip
    type: choice
    choices: ${params.protected_dest_pool}

  - name: src_port
    type: int_range
    min: 1024
    max: 65535

  - name: dest_port
    type: weighted_choice
    choices:
      "443": 0.75
      "80":  0.25

  # CEF `app` extension — ArcSight ApplicationProtocol. F5 emits
  # HTTP/HTTPS literal per certified guide.
  - name: app_protocol
    type: template
    template: "{% if dest_port == '443' %}HTTPS{% else %}HTTP{% endif %}"

  - name: geo_location
    type: weighted_choice
    choices:
      "RU": 0.18
      "CN": 0.22
      "US": 0.25
      "BR": 0.12
      "RO": 0.08
      "N/A": 0.15

  # attack_type — drives which ArcSight scenario rule fires. Values
  # are the literal F5 ATTACK_TYPE_* tokens emitted in cs4=, per
  # F5 TechDocs "Event Messages and Attack Types" and the verbatim
  # ArcSight Certified CEF Guide page 8 sample
  # (cs4=Cross Site Scripting (XSS)). Distribution matches native
  # sibling so a paired run on both wire forms exercises rules
  # symmetrically.
  - name: attack_type
    type: weighted_choice
    choices:
      "SQL-Injection":              0.25
      "Cross Site Scripting (XSS)": 0.20
      "Vulnerability Scan":         0.18
      "Brute Force Attack":         0.15
      "Buffer Overflow":            0.10
      "Path Traversal":             0.07
      "Other Application Activity": 0.05

  # CEF header field 4 = Device Event Class ID. Two real-world
  # conventions per ArcSight Certified Guide:
  #   - Attack-signature hit: emit the numeric F5 signature id.
  #     (Real ids verified against signatures.f5.com / Picus DB.)
  #   - Violation/BF/Anomaly: emit the violation-name string
  #     directly (e.g. "Brute Force Attack", "Illegal query
  #     string length").
  - name: signature_id_header
    type: template
    template: |-
      {%- if attack_type == 'SQL-Injection' -%}
      200001475
      {%- elif attack_type == 'Cross Site Scripting (XSS)' -%}
      200000091
      {%- elif attack_type == 'Buffer Overflow' -%}
      200002041
      {%- elif attack_type == 'Path Traversal' -%}
      200001112
      {%- elif attack_type == 'Vulnerability Scan' -%}
      200021069
      {%- elif attack_type == 'Brute Force Attack' -%}
      Brute Force Attack
      {%- else -%}
      Illegal query string length
      {%- endif %}

  # CEF header field 5 = Name. Pairs 1:1 with signature_id_header
  # using F5's canonical attack-signature names (verified from
  # ArcSight Certified Guide page 8: name="XSS script tag (Parameter)"
  # paired with class id 200000098).
  - name: name_header
    type: template
    template: |-
      {%- if attack_type == 'SQL-Injection' -%}
      SQL-INJ ' OR 1=1 -- (Parameter)
      {%- elif attack_type == 'Cross Site Scripting (XSS)' -%}
      XSS script tag (Parameter)
      {%- elif attack_type == 'Buffer Overflow' -%}
      Buffer overflow attempt (Header)
      {%- elif attack_type == 'Path Traversal' -%}
      Directory traversal (../../etc/passwd) (URI)
      {%- elif attack_type == 'Vulnerability Scan' -%}
      Automated client access "sqlmap"
      {%- elif attack_type == 'Brute Force Attack' -%}
      Transparent
      {%- else -%}
      HTTP protocol compliance failed
      {%- endif %}

  # CEF Severity (header field 6). ArcSight 0..10 scale. F5 certified
  # samples: typical violation = 6 (Illegal query string length),
  # signature hit = 5..7 (XSS=5, BO=7), BF Attack = 8.
  - name: cef_severity
    type: template
    template: |-
      {%- if attack_type == 'Brute Force Attack' -%}
      8
      {%- elif attack_type == 'Buffer Overflow' or attack_type == 'SQL-Injection' -%}
      7
      {%- elif attack_type == 'Cross Site Scripting (XSS)' or attack_type == 'Path Traversal' -%}
      5
      {%- elif attack_type == 'Vulnerability Scan' -%}
      6
      {%- else -%}
      4
      {%- endif %}

  # CEF `act` — F5 certified guide uses lowercase for violation
  # events (`act=alerted`) and titlecase for BF-attack family
  # (`act=Alerted` — page 9 sample). Drives 已阻擋 vs 未阻擋
  # ArcSight rule split.
  - name: act_value
    type: weighted_choice
    choices:
      "blocked": 0.70
      "alerted": 0.20   # detect-only / transparent mode (CEF rename of native "alarmed")
      "passed":  0.10   # below blocking threshold

  - name: response_code
    type: template
    template: "{% if act_value == 'blocked' %}0{% else %}200{% endif %}"

  - name: request_method
    type: weighted_choice
    choices:
      "POST":   0.55
      "GET":    0.35
      "PUT":    0.05
      "DELETE": 0.05

  # CEF `request` extension — URI portion. F5 puts the full path+query
  # here (cf. ArcSight Certified Guide page 7:
  #   request=/phpauction/search.php?=&q=%3Cscript%3E... ).
  - name: request_uri
    type: weighted_choice
    choices:
      "/login.php?id=1' OR '1'='1":                  0.18
      "/search?q=<script>alert(1)</script>":         0.15
      "/admin/exec?cmd=cat%20/etc/passwd":           0.13
      "/download?file=../../etc/shadow":             0.10
      "/cart?coupon=' UNION SELECT NULL--":          0.12
      "/api/v1/items?filter[id]=1%20AND%20SLEEP(5)": 0.10
      "/":                                           0.10
      "/api/auth?user=admin&pwd=admin123":           0.12

  # F5 ASM support_id — 18..20 digit decimal request correlator
  # (ArcSight Certified Guide page 7 sample:
  #   externalId=416829024209663345). 64-bit integer rendered as
  # decimal string. We use hex_16 here because the engine lacks a
  # numeric-decimal-of-fixed-width faker; downstream parsers treat
  # externalId as opaque so this is wire-acceptable.
  - name: support_id
    type: faker
    method: hex_16

  - name: x_forwarded_for_header_value
    type: weighted_choice
    choices:
      "N/A":             0.50
      "203.0.113.45":    0.15
      "198.51.100.77":   0.15
      "45.142.213.18":   0.10
      "194.165.16.99":   0.10

  # violation_rating — F5 1..5 scale, emitted as cn2 in CEF mode
  # per cef0.f5.asm parser. Same distribution as native sibling.
  - name: violation_rating
    type: weighted_choice
    choices:
      "1": 0.05
      "2": 0.10
      "3": 0.20
      "4": 0.35
      "5": 0.30

  - name: unit_hostname
    type: param
    param: unit_hostname

  - name: dvchost_fqdn
    type: param
    param: dvchost_fqdn

  - name: device_id
    type: param
    param: device_id

  - name: management_ip_address
    type: param
    param: management_ip_address

  - name: policy_name
    type: param
    param: policy_name

  - name: web_application_name
    type: param
    param: web_application_name

  # CEF Device Version (header field 3) — real BIG-IP 16.x release
  # strings (verified via F5 TechDocs Release Notes). Same vocabulary
  # as native sibling.
  - name: software_version
    type: weighted_choice
    choices:
      "16.1.4":  0.50
      "16.1.3":  0.30
      "15.1.10": 0.20

# CEF wire format — strict layout per ArcSight CEF spec:
#   CEF:Version|DeviceVendor|DeviceProduct|DeviceVersion|SignatureID|Name|Severity|Extension
# Note the F5-specific `ASM:` prefix BEFORE `CEF:0|` (literal token
# preserved by every parser — LogRhythm, Graylog CEF, ArcSight,
# QRadar DSM). Extension key order matches the canonical ArcSight
# Certified F5 ASM CEF Configuration Guide field order (pages 7-8).
# Inline mapping:
#   dvchost      ← unit_hostname FQDN
#   dvc          ← management_ip_address
#   cs1/cs1Label ← policy_name
#   cs2/cs2Label ← web_application_name
#   cs4/cs4Label ← attack_type
#   cs5/cs5Label ← x_forwarded_for_header_value
#   cs6/cs6Label ← geo_location
#   cn1/cn1Label ← response_code
#   cn2/cn2Label ← violation_rating
#   cn3/cn3Label ← device_id (numeric — ArcSight types cn3 as Long, a
#                 string here is dropped with a parser warning; audit
#                 2026-08-21. Real F5 devices sometimes leave cn3
#                 blank — we always emit to keep all 32 rules
#                 covered.)
#   deviceCustomDate1 ← policy_apply_date
#   externalId   ← support_id
#   src / spt    ← client ip / src_port
#   dst / dpt    ← server ip / dest_port
#   requestMethod ← HTTP method
#   app          ← protocol (HTTP/HTTPS)
#   request      ← URI
#   rt           ← event time (CEF-format date)
#   deviceExternalId ← 0 (F5 default per certified guide)
template: |-
  <{{pri}}>{{rfc3164_ts}} {{unit_hostname}} ASM:CEF:0|F5|ASM|{{software_version}}|{{signature_id_header}}|{{name_header}}|{{cef_severity}}|dvchost={{dvchost_fqdn}} dvc={{management_ip_address}} cs1={{policy_name}} cs1Label=policy_name cs2={{web_application_name}} cs2Label=web_application_name deviceCustomDate1={{policy_apply_date_cef}} deviceCustomDate1Label=policy_apply_date externalId={{support_id}} act={{act_value}} cn1={{response_code}} cn1Label=response_code src={{client_ip}} spt={{src_port}} dst={{server_ip}} dpt={{dest_port}} requestMethod={{request_method}} app={{app_protocol}} request={{request_uri | cef_escape}} cs5={{x_forwarded_for_header_value}} cs5Label=x_forwarded_for_header_value rt={{cef_rt}} deviceExternalId=0 cs4={{attack_type}} cs4Label=attack_type cs6={{geo_location}} cs6Label=geo_location cn2={{violation_rating}} cn2Label=violation_rating cn3={{device_id}} cn3Label=device_id
