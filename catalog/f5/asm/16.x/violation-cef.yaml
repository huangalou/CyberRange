vendor: f5
product: asm
version: "16.x"
log_type: waf.violation-cef
description: |
  F5 BIG-IP ASM / Advanced WAF violation event in **ArcSight Common
  Event Format (CEF)** wire form. This is what arrives at SIEMs running
  ArcSight ESM / ArcSight Logger or any CEF-only ingest path (Splunk
  Connect for Syslog, Microsoft Sentinel CEF-via-AMA, IBM QRadar
  CEF DSM, Graylog CEF input, etc.).

  Sibling catalog (same ASM event, NATIVE wire form):
    catalog/f5/asm/16.x/violation.yaml  (format: key_value, `ASM:` body)

  Where does CEF actually come from on F5?
  Unlike most SIEM-vendor catalogs in CyberRange, F5 BIG-IP ASM
  **emits CEF natively** when the admin configures a Remote Logging
  Profile with storage type **"ArcSight"** (F5 TechDocs term — same
  profile UI page that exposes the "Reporting Server / Splunk" option
  used by the native sibling). Per the F5 TechDocs "Logging
  Application Security Events" page (BIG-IP 13.1 onward, including
  16.x and 17.x), the three storage types on a Remote Logging
  Profile are:
    - "Remote": plain syslog (raw key-value)
    - "Reporting Server": predefined Splunk key-value format
       → catalog `violation.yaml`
    - "ArcSight": "Log messages are in Common Event Format (CEF)"
       → THIS CATALOG
  So in production you see EITHER the native key-value sibling OR
  this CEF form on the wire — pick whichever the customer has
  configured. Some deployments also receive CEF after an upstream
  ArcSight SmartConnector re-emit; the wire output is the same.

  Source-of-truth (URLs fetched 2026-05-14):
    - F5 TechDocs "Logging Application Security Events" (BIG-IP 17.0,
      same field set as 16.x):
        https://techdocs.f5.com/en-us/bigip-17-0-0/big-ip-asm-implementations/logging-application-security-events.html
      ("For remote logging, you can send logging files for storage on
      a remote system [...] on a reporting server [...] or on an
      ArcSight server (in CEF format)." — confirms native CEF support.)
    - F5 TechDocs "Event Messages and Attack Types" (canonical
      ATTACK_TYPE_* vocabulary, shared with the native sibling):
        https://techdocs.f5.com/kb/en-us/products/big-ip_ltm/manuals/product/bigip-external-monitoring-implementations-13-1-0/15.html
    - **ArcSight F5 ASM Certified CEF Configuration Guide** (PDF
      hosted by F5 themselves — the authoritative field map):
        https://www.f5.com/images/solution-center/arcsight-f5-asm-certified-cef-onfiguration-guide.pdf
      Verbatim test fixtures preserved in the Graylog CEF parser repo:
        https://github.com/Graylog2/graylog-plugin-cef/blob/master/src/test/resources/fixtures/arcsight-f5-asm-certified-cef-onfiguration-guide_page7_example1.json
        https://github.com/Graylog2/graylog-plugin-cef/blob/master/src/test/resources/fixtures/arcsight-f5-asm-certified-cef-onfiguration-guide_page8_example1.json
        https://github.com/Graylog2/graylog-plugin-cef/blob/master/src/test/resources/fixtures/arcsight-f5-asm-certified-cef-onfiguration-guide_page9_example1.json
    - LogRhythm syslog source "F5 BIG-IP ASM CEF" (independent parser
      that targets the same wire form):
        https://docs.logrhythm.com/devices/docs/syslog-f5-big-ip-asm-cef
    - Devo / Logtrust cef0.f5.asm parser (third-party confirmation of
      the cs1..cs6 / cn1..cn3 label mapping):
        https://docs.devo.com/confluence/ndt/v7.3.0/parsers-and-collectors/technologies-supported-in-cef-syslog-format/cef0-f5-asm
    - IBM QRadar DSM "F5 Networks BIG-IP ASM" sample events:
        https://www.ibm.com/docs/en/dsm?topic=fnbia-f5-networks-big-ip-asm-sample-event-messages
    - Sekoia F5 BIG-IP parser (ASM CEF field map):
        https://docs.sekoia.io/integration/categories/network/f5-big-ip/
    - Securonix F5 BIG-IP ASM Syslog deployment guide (CEF profile):
        https://documentation.securonix.com/bundle/securonix-on-prem-user-guide/page/content/active-deployment-guides/f5-big-ip-asm-syslog.htm

  Verbatim sample (ArcSight F5 ASM Certified CEF Guide page 7,
  reproduced from Graylog's test fixture — one physical line on wire):
    Sep 2 17:50:25 172.30.0.130 ASM:CEF:0|F5|ASM|10.1.0|Illegal query
    string length|Illegal query string length|6|dvchost=3600.lab.asm.f5net.com
    dvc=172.30.0.20 cs1=new_app_default cs1Label=policy_name cs2=new_app
    cs2Label=web_application_name deviceCustomDate1=Sep 02 2009 15:09:20
    deviceCustomDate1Label=policy_apply_date externalId=416829024209663345
    act=alerted cn1=200 cn1Label=response_code src=172.30.0.126
    spt=37446 dst=172.30.0.32 dpt=80 requestMethod=GET app=HTTP
    request=/phpauction/search.php?\=&q\=%3Cscript%3E%3C%2Fscript%3E&\=Go%21
    cs5= cs5Label=x_forwarded_for_header_value rt=Sep 02 2009 17:09:25
    deviceExternalId=0 cs4=Buffer Overflow cs4Label=attack_type
    cs6=N/A cs6Label=geo_location cs3Label=full_request cs3=GET ...

  Key wire-form quirks (preserve these exactly — every downstream
  parser depends on them):
    1. The body is prefixed by literal `ASM:` BEFORE the `CEF:0|` —
       i.e. `ASM:CEF:0|F5|ASM|...`. This is the F5 native form; the
       `ASM:` tag never disappears, even in CEF mode.
    2. Header field 1 = Device Vendor = `F5`.
       Header field 2 = Device Product = `ASM` (NOT "Advanced WAF" —
       the product header keeps the legacy `ASM` token forever).
       Header field 3 = Device Version = software release, e.g. `16.1.4`.
    3. Header field 4 = Device Event Class ID. F5 uses TWO conventions
       depending on event family (per ArcSight Certified Guide):
         - Attack-signature hit: NUMERIC signature id, e.g. `200000098`
           (XSS), `200001475` (SQL-INJ), `200002041` (BO), `200001112`
           (Path Traversal), `200021069` (Vuln-Scan).
         - Violation / BF / Anomaly: human violation NAME, e.g.
           `Illegal query string length`, `Brute Force Attack`,
           `Web Scraping Attack`.
       Header field 5 = Name (Violation/event description).
       Header field 6 = Severity 0..10 (ArcSight scale).
    4. F5 CEF `act` vocabulary: `passed` | `alerted` | `blocked`.
       Note: F5 CEF uses `alerted` here while the native key-value
       form uses `alarmed` — the ArcSight transform renames it.
       Real F5 CEF samples (ArcSight Certified Guide pages 7/8/9)
       show both `act=alerted` (lowercase) and `act=Alerted`
       (titlecase, BF-attack family). We emit lowercase for
       violation events and Title-cased for BF-attack family to
       match observed real samples.
    5. Custom-field label mapping (every cs*/cn* slot has a Label
       extension — never emit a value without its Label):
         cs1 = policy_name                  cs1Label=policy_name
         cs2 = web_application_name         cs2Label=web_application_name
         cs3 = full_request (HTTP req dump) cs3Label=full_request
         cs4 = attack_type                  cs4Label=attack_type
         cs5 = x_forwarded_for_header_value cs5Label=x_forwarded_for_header_value
         cs6 = geo_location                 cs6Label=geo_location
         cn1 = response_code                cn1Label=response_code
         cn2 = violation_rating             cn2Label=violation_rating
         cn3 = device_id                    cn3Label=device_id
         deviceCustomDate1 = policy_apply_date
                                            deviceCustomDate1Label=policy_apply_date
         externalId = support_id (the F5 numeric request correlator)
         dvchost = unit_hostname  dvc = management_ip_address
         src/spt = ip_client / src_port   dst/dpt = dest_ip / dest_port
         requestMethod = method           app = protocol (HTTP/HTTPS)
         request = URI                    rt = event time (CEF format)
    6. F5 CEF does NOT use ArcSight `suser` / `duser` — `username`
       does not get its own extension in the certified guide; it is
       carried inside `full_request` cookies/headers only. We follow
       suit (do not invent a `suser` mapping).
    7. F5 CEF lacks dedicated extensions for sig_ids and sig_names
       once they are matched — the matched signature id becomes the
       Device Event Class ID (header field 4); the human signature
       name becomes the Name (header field 5).

  SIEM rule mapping: covers the SAME 32 WAF rules
  (from a reference SIEM ruleset) as the native sibling. The
  CEF emitter populates `src` (client) and `dst` (server) — drives
  the 內/外 zone axis through 6-tuple matching on the Wazuh side, and
  request_status (passed/alerted/blocked) → 已阻擋 vs 未阻擋 split.

  Rule coverage matrix (scenario × 內/外 host axis) — identical to
  the native sibling:
    SQL-Injection 攻擊            內部 130021/130082  外部 130005/130079
    XSS 攻擊                      內部 130035/130091  外部 130108/130145
    密碼暴力破解                  內部 130019/130038  外部 130081/130131
    弱點掃描 by_name              內部 130065/130146  外部 130002/130126
    弱點掃描 by_自訂字串4         內部 130139/130147  外部 130049/130086
    緩衝區溢位                    內部 130078/130095  外部 130054/130125
  Cross-cut:
    伺服器主機觸發大量已阻擋      130015/130070
    資安設備偵測內對內伺服器高風險未阻擋  130003/130056
    資安設備偵測內對外高風險未阻擋        130014/130124
    資安設備偵測外對內高風險未阻擋        130121/130127

format: cef
transport: [udp_syslog, tcp_syslog, file, beats]

ocsf:
  class: web_resources_activity
  category_uid: 6
  class_uid: 6004

detections:
  wazuh:
    # CEF lines are decoded by Wazuh's built-in `cef` decoder (F5
    # CEF is the canonical ArcSight format; no custom `f5-asm`
    # decoder needed for this wire form). The 32 rule_ids match the
    # native sibling exactly; only the upstream wire form differs.
    - decoder: cef
    # Attack-type rules (each scenario × 內/外 軸 都覆蓋)
    - rule_id: 130005   # WAF_外部主機嘗試SQL-Injection攻擊
      level: 7
    - rule_id: 130079   # WAF_外部主機嘗試SQL-Injection攻擊
      level: 7
    - rule_id: 130021   # WAF_內部主機嘗試SQL-Injection攻擊
      level: 7
    - rule_id: 130082   # WAF_內部主機嘗試SQL-Injection攻擊
      level: 7
    - rule_id: 130108   # WAF_外部主機嘗試XSS攻擊
      level: 7
    - rule_id: 130145   # WAF_外部主機嘗試XSS攻擊
      level: 7
    - rule_id: 130035   # WAF_內部主機嘗試XSS攻擊
      level: 7
    - rule_id: 130091   # WAF_內部主機嘗試XSS攻擊
      level: 7
    - rule_id: 130081   # WAF_外部主機嘗試密碼暴力破解
      level: 7
    - rule_id: 130131   # WAF_外部主機嘗試密碼暴力破解
      level: 7
    - rule_id: 130019   # WAF_內部主機嘗試密碼暴力破解
      level: 7
    - rule_id: 130038   # WAF_內部主機嘗試密碼暴力破解
      level: 7
    - rule_id: 130002   # WAF_外部主機執行弱點掃描攻擊 by_name 1m.10
      level: 7
    - rule_id: 130126   # WAF_外部主機執行弱點掃描攻擊 by_name 1m.5
      level: 7
    - rule_id: 130049   # WAF_外部主機執行弱點掃描攻擊 by_自訂字串4 1m.5
      level: 7
    - rule_id: 130086   # WAF_外部主機執行弱點掃描攻擊 by_自訂字串4 1m.10
      level: 7
    - rule_id: 130065   # WAF_內部主機執行弱點掃描攻擊 by_name 1m.5
      level: 7
    - rule_id: 130146   # WAF_內部主機執行弱點掃描攻擊 by_name 1m.5
