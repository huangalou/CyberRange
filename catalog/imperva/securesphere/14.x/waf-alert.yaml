vendor: imperva
product: securesphere
version: "14.x"
log_type: waf.alert
description: |
  Imperva SecureSphere WAF Gateway 14.x (on-prem appliance) security alert
  emitted via a CEF Action Set ("Main > Policies > Action Sets > Gateway
  System Log → CEF format"). The CEF template is the verbatim Imperva-
  published one — variable substitutions resolve against the SecureSphere
  Alert / Event / Rule object model.

  NOTE: This is **SecureSphere on-prem**, NOT Imperva Cloud WAF / Incapsula
  (different product family, different wire format, different parser in
  Elastic — `imperva` vs `imperva_cloud_waf` packages).

  Source-of-truth (wire format + field mapping):
    - Imperva official "Common Event Format" guide (PDF), Jan 3 2018,
      sections "CEF Format Action Definitions" for Security Alerts:
      https://www.imperva.com/docs/sb_imperva_securesphere_cef_guide.pdf
    - Splunk Community sample (verbatim CEF template + alertType note):
      https://community.splunk.com/t5/Security/Log-example-for-Imperva-SecureSphere-CEF-LEEF/m-p/127047
    - Splunk Connect for Syslog SC4S, Imperva WAF vendor source:
      https://splunk.github.io/splunk-connect-for-syslog/main/sources/vendor/Imperva/waf/
    - Elastic Integrations `imperva` package (CEF only, on-prem SecureSphere):
      https://github.com/elastic/integrations/blob/main/packages/imperva/docs/README.md
    - Cyderes parser KB (`act=None` SQL-policy sample):
      https://docs.cyderes.cloud/parser-knowledge-base/impervasecuresphere/
    - Google Chronicle Imperva CEF default parser:
      https://docs.cloud.google.com/chronicle/docs/ingestion/default-parsers/imperva-cef
    - SecureSphere 14.7 = LTS patch release (Imperva docs portal):
      https://docs.imperva.com/bundle/v14.7-waf-release-notes/page/87366.htm

  Verbatim Imperva CEF template (from Imperva CEF Guide §Security Alerts):
    CEF:0|Imperva Inc.|SecureSphere|[version]|${Alert.alertType}|
    ${Alert.alertMetadata.alertName}|${Alert.severity}|
    act=${Alert.immediateAction} dst=${Event.destInfo.serverIp}
    dpt=${Event.destInfo.serverPort} duser=${Alert.username}
    src=${Event.sourceInfo.sourceIp} spt=${Event.sourceInfo.sourcePort}
    proto=${Event.sourceInfo.ipProtocol} rt=#arcsightDate(${Alert.createTime})
    cat=Alert cs1=${Rule.parent.displayName} cs1Label=Policy
    cs2=${Alert.serverGroupName} cs2Label=ServerGroup
    cs3=${Alert.serviceName} cs3Label=ServiceName
    cs4=${Alert.applicationName} cs4Label=ApplicationName
    cs5=${Alert.description} cs5Label=Description

  Verbatim raw samples (cited):
    1. SQL-policy Custom violation (Cyderes / Imperva CEF Guide):
       Apr 22 09:05:40 hostname1 CEF:0|Imperva Inc.|SecureSphere|13.6.0|
       Custom|Custom Violation|Informative|act=None dst=10.10.0.2 dpt=80
       duser=username1 src=10.10.0.1 spt=80 rt=Apr 22 2022 09:05:40
       cat=Alert cs1=Multiple Query Errors cs1Label=Policy
    2. Firewall alert (Splunk Community / SC4S):
       Apr 19 10:29:53 3.3.3.3 CEF:0|Imperva Inc.|SecureSphere|12.0.0|
       Firewall|SSL Untraceable Connection|Medium|
    3. SystemEvent (Elastic integration sample, SecureSphere 15.1):
       <14>CEF:0|Imperva Inc.|SecureSphere|15.1.0|User logged in|
       User admin logged in from 81.2.69.142.|High|suser=admin
       rt=Oct 05 2023 18:33:02 cat=SystemEvent

  Real values pinned from sources (do not invent beyond these):
    - alertType (CEF header field 5): Signature | Profile | Protocol |
      Correlation | Firewall | Custom — exactly 6 values per Imperva CEF
      Guide. `Custom` is used when a custom policy fired; the others map to
      SecureSphere's built-in policy categories.
    - alertName (CEF header field 6): the human-readable policy / rule
      name (e.g. "Multiple Query Errors", "SSL Untraceable Connection").
      For the canonical `Custom` alertType, Imperva often emits the literal
      string "Custom Violation" as alertName.
    - severity (CEF header field 7): Informative | Low | Medium | High —
      TEXT values, not numeric. Per LogRhythm / Imperva docs, the WAF
      itself only emits these four labels. CEF severity 0–10 numeric scale
      is NOT used by Imperva.
    - act / Alert.immediateAction: None | Block — only two values per
      Imperva docs ("immediate action is either block transaction or no
      action"). The earlier catalog used "Blocked / Alerted / Reported"
      which are F5 ASM / Incapsula terms, NOT SecureSphere on-prem.
    - Custom fields cs1..cs5 only — Imperva's published template stops
      at cs5Label=Description. cs6+ / cn1..cn3 in the prior catalog were
      invented (or copied from Imperva DAM / DB Security, a different
      product). signature_id / event_id are also not in the on-prem WAF
      CEF action set.

  SIEM rule mapping: covers the same vendor-agnostic 32-rule WAF
  family as F5 ASM / NetScaler / FortiWeb. Imperva-specific keying:
    - cs1 (Policy) holds the rule / policy name (e.g. "SQL Injection",
      "Cross Site Scripting", "Recommended Whitelist Violation", "Brute
      Force from Single Source"). This is the **primary field**
      downstream Wazuh / ELK rules regex against.
    - act drives `已阻擋 / 未阻擋` axis (Block / None).
    - src vs internal/external CIDR drives `外部 / 內部` axis.
    - alertType=`Signature` correlates with the Sigma / Snort signature
      policy class — used for SQL-Inj / XSS / Buffer Overflow regex hits.

  Rule coverage matrix: see f5/asm/16.x/violation.yaml — Imperva catalog
  hits the identical 32 rule_ids via cs1 Policy + act + src zone.

format: cef
transport: [udp_syslog, tcp_syslog, file]

ocsf:
  class: web_resources_activity
  category_uid: 6
  class_uid: 6004

detections:
  wazuh:
    - decoder: cef
    # Attack-type rules — 內 / 外 軸都覆蓋
    - rule_id: 130005   # WAF_外部主機嘗試SQL-Injection攻擊
      level: 7
    - rule_id: 130079
      level: 7
    - rule_id: 130021   # WAF_內部主機嘗試SQL-Injection攻擊
      level: 7
    - rule_id: 130082
      level: 7
    - rule_id: 130108   # WAF_外部主機嘗試XSS攻擊
      level: 7
    - rule_id: 130145
      level: 7
    - rule_id: 130035   # WAF_內部主機嘗試XSS攻擊
      level: 7
    - rule_id: 130091
      level: 7
    - rule_id: 130081   # WAF_外部主機嘗試密碼暴力破解
      level: 7
    - rule_id: 130131
      level: 7
    - rule_id: 130019   # WAF_內部主機嘗試密碼暴力破解
      level: 7
    - rule_id: 130038
      level: 7
    - rule_id: 130002   # WAF_外部主機執行弱點掃描 by_name 1m.10
      level: 7
    - rule_id: 130126   # by_name 1m.5
      level: 7
    - rule_id: 130049   # by_自訂字串4 1m.5
      level: 7
    - rule_id: 130086   # by_自訂字串4 1m.10
      level: 7
    - rule_id: 130065   # WAF_內部主機執行弱點掃描 by_name
      level: 7
    - rule_id: 130146
      level: 7
    - rule_id: 130139   # by_自訂字串4
      level: 7
    - rule_id: 130147
      level: 7
    - rule_id: 130054   # WAF_外部主機緩衝區溢位
      level: 7
    - rule_id: 130125
      level: 7
    - rule_id: 130078   # WAF_內部主機緩衝區溢位
      level: 7
    - rule_id: 130095
      level: 7
    # Cross-cut
    - rule_id: 130015   # WAF_伺服器主機觸發大量已阻擋
      level: 7
    - rule_id: 130070
      level: 7
    - rule_id: 130003   # WAF_資安設備內對內伺服器高風險未阻擋
      level: 7
    - rule_id: 130056
      level: 7
    - rule_id: 130014   # WAF_資安設備內對外高風險未阻擋
      level: 7
    - rule_id: 130124
      level: 7
    - rule_id: 130121   # WAF_資安設備外對內高風險未阻擋
      level: 7
    - rule_id: 130127
      level: 7
  sigma:
    - rule: imperva_securesphere_waf
      ref: https://github.com/SigmaHQ/sigma
  elk_detection:
    - kibana_rule_id: cef-waf-attack-blocked
      severity: high
    - kibana_rule_id: cef-waf-high-severity-unblocked
      severity: critical

mythos_alignment:
  risk_refs: [R1, R4]
  pa_refs: [PA1]
  ttx_class: rapid

regression:
  baseline_alert_count: 1000
  baseline_ttd_ms: 3000

params:
  syslog_host:
    default: "imp-waf-mx.lab.local"
  server_group:
    default: "Prod Web Servers"
  service_name:
    default: "Default Web Service"
  application_name:
    default: "Default Web Application"
  external_attacker_pool:
    default:
      - "203.0.113.45"
      - "198.51.100.77"
      - "45.142.213.18"
      - "194.165.16.99"
      - "172.93.179.115"
  internal_source_pool:
    default: "10.0.20.0/24"
  protected_dest_pool:
    default:
      - "10.0.50.10"
      - "10.0.50.11"
      - "10.0.50.12"
      - "10.0.50.13"
      - "10.0.50.14"
  user_pool:
    default: ["anonymous", "guest", "admin", "test", "username1"]

fields:
  - name: pri
    type: fixed
    value: 14   # user.info — SC4S Imperva sample uses <14>

  - name: rfc3164_ts
    type: datetime
    format: "%b %d %H:%M:%S"

  # rt= uses ArcSight-style "MMM dd yyyy HH:mm:ss" per Imperva CEF Guide
  # macro #arcsightDate().
  - name: arcsight_rt
    type: datetime
    format: "%b %d %Y %H:%M:%S"

  - name: syslog_host
    type: param
    param: syslog_host

  # Imperva SecureSphere on-prem real release strings. 14.7 is the LTS
  # patch line; 14.6 EOS 2024-04-30; 14.8 newer.
  - name: imp_version
    type: weighted_choice
    choices:
      "14.7.0.20": 0.40   # LTS
      "14.7.0.40": 0.20
      "14.6.0.30": 0.20   # EOS but still in field
      "14.8.0.10": 0.20

  # alertType — exactly the 6 categories from Imperva CEF Guide.
  # Drives whether Signature-class regex hits or Custom-policy rules fire.
  - name: alert_type
    type: weighted_choice
    choices:
      "Signature":   0.40   # built-in WAF signatures (SQLi/XSS/scan/BO)
      "Custom":      0.25   # custom policy violations
      "Profile":     0.15   # dynamic profiling / whitelist learning
      "Protocol":    0.10   # HTTP protocol violations
      "Correlation": 0.05   # CAV — Correlated Attack Validation
      "Firewall":    0.05   # network firewall layer

  # src_zone drives external vs internal axis for ArcSight 32-rule split.
  - name: src_zone
    type: weighted_choice
    choices:
      external: 0.60
      internal: 0.40

  - name: external_src
    type: choice
    choices: ${params.external_attacker_pool}

  - name: internal_src
    type: cidr
    cidr: ${params.internal_source_pool}

  - name: src_ip
    type: template
    template: "{% if src_zone == 'external' %}{{external_src}}{% else %}{{internal_src}}{% endif %}"

  - name: dst_ip
    type: choice
    choices: ${params.protected_dest_pool}

  - name: src_port
    type: int_range
    min: 1024
    max: 65535

  - name: dst_port
    type: weighted_choice
    choices:
      "443": 0.75
      "80":  0.25

  - name: proto
    type: weighted_choice
    choices:
      "TCP": 1.0

  # cs1 — Policy name. THIS is the primary keying field for the downstream
  # ArcSight 32-rule family. The string after "cs1=" must match a real
  # Imperva built-in or commonly-used custom policy name. Values pulled
  # from Imperva Default Policies + Cyderes/Splunk samples; the
  # "Recommended ... Violation" strings are real Imperva auto-learning
  # whitelist policy names.
  - name: policy_name
    type: weighted_choice
    choices:
      "SQL Injection":                              0.22
      "Cross Site Scripting":                       0.18
      "Recommended HTTP Header Violation":          0.05
      "Recommended Whitelist Violation":            0.05
      "Brute Force from Single Source - Login":     0.10
      "Brute Force from Multiple Sources - Login":  0.03
      "Buffer Overflow":                            0.08
      "Directory Traversal":                        0.08
      "Parameter Tampering":                        0.05
      "HTTP Protocol Compliance":                   0.04
      "Web Server Reconnaissance Scan":             0.05
      "Multiple Query Errors":                      0.04
      "Web Worm":                                   0.03

  # alertName — human label that appears in CEF header field 6. For
  # Custom policy fires Imperva often emits the literal "Custom Violation"
  # (per Cyderes / Imperva CEF Guide example). For built-in policies the
  # alertName usually echoes the policy_name or a signature subtitle.
  - name: alert_name
    type: template
    template: "{% if alert_type == 'Custom' %}Custom Violation{% else %}{{policy_name}}{% endif %}"

  # severity — Imperva emits text (Informative / Low / Medium / High).
  # NOT numeric. CEF spec normally uses 0-10 numeric but Imperva's
  # documented Action Set keeps the SecureSphere internal label.
  - name: severity
    type: weighted_choice
    choices:
      "High":         0.45
      "Medium":       0.30
      "Low":          0.15
      "Informative":  0.10

  # act / Alert.immediateAction — only two real values per Imperva docs.
  # Drives 已阻擋 / 未阻擋 axis. "None" = detect-only / monitoring mode.
  - name: action
    type: weighted_choice
    choices:
      "Block": 0.65
      "None":  0.35

  - name: user_name
    type: choice
    choices: ${params.user_pool}

  - name: server_group
    type: param
    param: server_group

  - name: service_name
    type: param
    param: service_name

  - name: application_name
    type: param
    param: application_name

  # cs5 Description — short free-text description Imperva includes.
  # Pulled from real Imperva alert.description samples (Cyderes, LogRhythm
  # SecureSphere parser docs).
  - name: description
    type: weighted_choice
    choices:
      "Signature violation matched":             0.30
      "Web application attack detected":         0.20
      "HTTP protocol violation":                 0.10
      "Suspected scanning activity":             0.10
      "Repeated authentication failures":        0.10
      "Profile mismatch - new URL accessed":     0.05
      "Buffer overflow attempt":                 0.05
      "Custom policy fired":                     0.10

# Template emits the verbatim Imperva CEF Action Set format. Header has 7
# pipe-delimited fields per CEF:0 spec, followed by the extension k=v list.
# Extension fields are EXACTLY those Imperva publishes (cs1..cs5 only).
# We do NOT add cn1/cn2/cs6+ — those would break the official parser.
template: |-
  <{{pri}}>{{rfc3164_ts}} {{syslog_host}} CEF:0|Imperva Inc.|SecureSphere|{{imp_version}}|{{alert_type}}|{{alert_name}}|{{severity}}|act={{action}} dst={{dst_ip}} dpt={{dst_port}} duser={{user_name}} src={{src_ip}} spt={{src_port}} proto={{proto}} rt={{arcsight_rt}} cat=Alert cs1={{policy_name}} cs1Label=Policy cs2={{server_group}} cs2Label=ServerGroup cs3={{service_name}} cs3Label=ServiceName cs4={{application_name}} cs4Label=ApplicationName cs5={{description}} cs5Label=Description
