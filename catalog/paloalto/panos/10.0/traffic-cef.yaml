vendor: paloalto
product: panos
version: "10.0"
log_type: traffic-cef
description: |
  PAN-OS 10.0 Traffic log emitted directly by the firewall in CEF (ArcSight
  Common Event Format v0). This is the standard wire format used by SOC
  customers who configure PA's `set deviceconfig setting management
  syslog-format CEF` (or per-server-profile CEF format).

  PA 10.0 is the LAST PAN-OS release with an officially-published CEF
  configuration guide — Palo Alto Networks deprecated CEF documentation
  after 10.0. Customers running 10.1 / 11.x continue to use the 10.0
  mapping as the de-facto reference; new fields added in 10.1+ have no
  vendor-blessed CEF key and customers must DIY. This catalog is the
  STARTING POINT (PA 10.0 official mapping); per-dispatch overrides via
  `cef_extension_overrides` let SOC engineers remap keys to match the
  CEF parser convention of their SIEM (Wazuh / ELK / Splunk / Sentinel /
  QRadar all read CEF but disagree on which extension keys carry which
  semantics — `cs1`/`cn1` slots are the most common reroute targets).

  Source-of-truth:
    - PAN-OS 10.0 CEF Configuration Guide (PDF, official):
        https://docs.paloaltonetworks.com/content/dam/techdocs/en_US/pdf/cef/pan-os-10-0-cef-configuration-guide.pdf
    - PAN-OS CEF guides index (lists guides from 4.0 through 10.0):
        https://docs.paloaltonetworks.com/resources/cef

  Authoritative CEF v0 wire shape per PA Traffic log:
    <PRI>MMM dd YYYY HH:MM:SS host CEF:0|Palo Alto Networks|PAN-OS|<ver>|<subtype>|TRAFFIC|<sev>|<ext>

  - PRI = facility local0 (16) * 8 + severity info (6) = 134 → "<134>"
  - DeviceVendor = "Palo Alto Networks"
  - DeviceProduct = "PAN-OS"
  - DeviceVersion = the device's PAN-OS version (e.g. "10.0.0", "11.1.4")
  - SignatureID   = the Traffic log subtype: end | start | drop | deny
  - Name          = literal "TRAFFIC"
  - Severity      = CEF 0-10 scale; PA Traffic emits 3 (informational)

  Default cef_mapping below follows the PA 10.0 admin guide Table-3
  (Traffic logs). Customers who use different SIEM-side parsers can
  remap any pa_field via dispatch-time `cef_extension_overrides`,
  e.g. `{"app": {"cef_key": "cs1"}}` to land App-ID into the cs1 slot
  for Wazuh's default PA decoder.

format: cef
transport: [udp_syslog, tcp_syslog, file, beats]

ocsf:
  class: network_activity
  category_uid: 4
  class_uid: 4001

# ──────────────── CEF v0 header (overridable per-dispatch) ────────────────

cef_header:
  device_vendor:  "Palo Alto Networks"
  device_product: "PAN-OS"
  device_version: "10.0.0"
  signature_id:   "end"
  name:           "TRAFFIC"
  severity:       3

# ──────────────── PA-field → CEF extension key mapping ────────────────
#
# Order in this list IS the order in the rendered extensions body.
# Each entry's `cef_key` is the PA-10.0-default; per-dispatch overrides
# can change either the key (relocation) or the value (substitution).

cef_mapping:
  - { pa_field: receive_time,        cef_key: rt }
  - { pa_field: serial,              cef_key: deviceExternalId }
  - { pa_field: log_subtype,         cef_key: PanOSLogSubtype }
  - { pa_field: src_ip,              cef_key: src }
  - { pa_field: dst_ip,              cef_key: dst }
  - { pa_field: natsrc_ip,           cef_key: sourceTranslatedAddress }
  - { pa_field: natdst_ip,           cef_key: destinationTranslatedAddress }
  - { pa_field: rule_name,           cef_key: PanOSRuleName }
  - { pa_field: src_user,            cef_key: suser }
  - { pa_field: dst_user,            cef_key: duser }
  - { pa_field: application,         cef_key: app }
  - { pa_field: virtual_system,      cef_key: PanOSVsys }
  - { pa_field: src_zone,            cef_key: PanOSSrcZone }
  - { pa_field: dst_zone,            cef_key: PanOSDstZone }
  - { pa_field: inbound_interface,   cef_key: deviceInboundInterface }
  - { pa_field: outbound_interface,  cef_key: deviceOutboundInterface }
  - { pa_field: log_action,          cef_key: PanOSLogAction }
  - { pa_field: session_id,          cef_key: externalId }
  - { pa_field: repeat_count,        cef_key: cnt }
  - { pa_field: src_port,            cef_key: spt }
  - { pa_field: dst_port,            cef_key: dpt }
  - { pa_field: nat_src_port,        cef_key: sourceTranslatedPort }
  - { pa_field: nat_dst_port,        cef_key: destinationTranslatedPort }
  - { pa_field: protocol,            cef_key: proto }
  - { pa_field: action,              cef_key: act }
  - { pa_field: bytes_total,         cef_key: bytes }
  - { pa_field: bytes_sent,          cef_key: out }
  - { pa_field: bytes_received,      cef_key: in }
  - { pa_field: start_time,          cef_key: start }
  - { pa_field: elapsed_time,        cef_key: PanOSElapsedTime }
  - { pa_field: category,            cef_key: cat }
  - { pa_field: src_country,         cef_key: PanOSSrcLocation }
  - { pa_field: dst_country,         cef_key: PanOSDstLocation }
  - { pa_field: pkts_sent,           cef_key: PanOSPacketsSent }
  - { pa_field: pkts_received,       cef_key: PanOSPacketsReceived }
  - { pa_field: session_end_reason,  cef_key: PanOSSessionEndReason }

# ──────────────── params ────────────────

params:
  hostname:
    default: "PA-VM-01.example.local"
  panos_version:
    default: "11.1.0"
  serial:
    default: "001234567890"
  src_cidr:
    default: "10.50.0.0/24"
  dst_pool:
    default:
      - "8.8.8.8"
      - "1.1.1.1"
      - "151.101.1.140"
      - "104.18.32.7"
      - "203.0.113.99"

# ──────────────── fields (one per pa_field in cef_mapping) ────────────────

fields:
  # syslog header
  - { name: pri, type: fixed, value: 134 }
  - { name: rfc3164_ts, type: datetime, format: "%b %d %Y %H:%M:%S" }
  - { name: hostname, type: param, param: hostname }

  # CEF extension values
  - { name: receive_time, type: datetime, format: "%b %d %Y %H:%M:%S" }
  - { name: serial,       type: param, param: serial }
  - name: log_subtype
    type: weighted_choice
    choices: { end: 0.70, drop: 0.15, start: 0.10, deny: 0.05 }
  - name: src_ip
    type: cidr
    cidr: ${params.src_cidr}
  - name: dst_ip
    type: choice
    choices: ${params.dst_pool}
  - { name: natsrc_ip, type: fixed, value: "0.0.0.0" }
  - { name: natdst_ip, type: fixed, value: "0.0.0.0" }
  - name: rule_name
    type: weighted_choice
    choices:
      "default-allow":    0.40
      "outbound-web":     0.25
      "dmz-to-inside":    0.10
      "guest-internet":   0.10
      "block-malicious":  0.05
      "default-deny":     0.10
  - name: src_user
    type: weighted_choice
    choices:
      "":                  0.70
      'CORP\alice':        0.10
      'CORP\bob':          0.10
      'CORP\svc-deploy':   0.10
  - name: dst_user
    type: fixed
    value: ""
  - name: application
    type: weighted_choice
    choices:
      "ssl":           0.30
      "web-browsing":  0.30
      "dns-base":      0.15
      "ssh":           0.05
      "smtp":          0.05
      "ms-rdp":        0.05
      "ftp":           0.03
      "incomplete":    0.07
  - { name: virtual_system,     type: fixed, value: "vsys1" }
  - name: src_zone
    type: weighted_choice
    choices: { trust: 0.60, dmz: 0.20, mgmt: 0.05, guest: 0.15 }
  - name: dst_zone
    type: weighted_choice
    choices: { untrust: 0.70, trust: 0.20, dmz: 0.10 }
  - name: inbound_interface
    type: weighted_choice
    choices: { "ethernet1/1": 0.40, "ethernet1/2": 0.30, "ethernet1/3": 0.20, "ethernet1/16": 0.10 }
  - name: outbound_interface
    type: weighted_choice
    choices: { "ethernet1/3": 0.40, "ethernet1/4": 0.30, "ethernet1/18.1": 0.20, "ethernet1/8": 0.10 }
  - { name: log_action,   type: fixed, value: "Forward_Syslog1" }
  - { name: session_id,   type: int_range, min: 100000, max: 9999999 }
  - { name: repeat_count, type: int_range, min: 1, max: 5 }
  - { name: src_port,     type: int_range, min: 1024, max: 65535 }
  - name: dst_port
    type: weighted_choice
    choices: { "443": 0.50, "80": 0.30, "53": 0.05, "22": 0.05, "25": 0.03, "3389": 0.02, "21": 0.05 }
  - { name: nat_src_port, type: int_range, min: 1024, max: 65535 }
  - { name: nat_dst_port, type: int_range, min: 0,    max: 65535 }
  - name: protocol
    type: weighted_choice
    choices: { tcp: 0.85, udp: 0.13, icmp: 0.02 }
  - name: action
    type: weighted_choice
    choices: { allow: 0.85, deny: 0.10, drop: 0.05 }
  - { name: bytes_total,    type: int_range, min: 64,   max: 5000000 }
  - { name: bytes_sent,     type: int_range, min: 64,   max: 500000 }
  - { name: bytes_received, type: int_range, min: 0,    max: 4500000 }
  - { name: start_time,     type: datetime,  format: "%b %d %Y %H:%M:%S" }
  - { name: elapsed_time,   type: int_range, min: 0,    max: 7200 }
  - name: category
    type: weighted_choice
    choices:
      "computer-and-internet-info": 0.30
      "any":                        0.25
      "business-and-economy":       0.15
      "social-networking":          0.10
      "content-delivery-networks":  0.10
      "search-engines":             0.05
      "shareware-and-freeware":     0.05
  - name: src_country
    type: weighted_choice
    choices: { TW: 0.85, US: 0.08, CN: 0.05, JP: 0.02 }
  - name: dst_country
    type: weighted_choice
    choices: { US: 0.50, TW: 0.20, JP: 0.10, NL: 0.05, DE: 0.05, IE: 0.05, SG: 0.05 }
  - { name: pkts_sent,      type: int_range, min: 1,    max: 1000 }
  - { name: pkts_received,  type: int_range, min: 0,    max: 4000 }
  - name: session_end_reason
    type: weighted_choice
    choices: { tcp-fin: 0.50, aged-out: 0.20, tcp-rst-from-client: 0.10, tcp-rst-from-server: 0.10, policy-deny: 0.05, threat: 0.05 }

# ──────────────── template ────────────────
#
# Wire format: RFC3164 syslog header + CEF v0 header + body.
# `cef_extensions` is the engine-composed extension body — engine walks
# `cef_mapping` (with optional overrides) and emits `k=v k=v` separated
# by single spaces.

template: |-
  <{{pri}}>{{rfc3164_ts}} {{hostname}} CEF:0|{{cef_header.device_vendor}}|{{cef_header.device_product}}|{{cef_header.device_version}}|{{cef_header.signature_id}}|{{cef_header.name}}|{{cef_header.severity}}|{{cef_extensions}}
