vendor: paloalto
product: panos
version: "10.0"
log_type: url-filtering-cef
description: |
  PAN-OS 10.0 URL Filtering log emitted in CEF format per the PA 10.0
  admin guide Table-5 (URL Filtering logs). Fires when a URL Filtering
  Security Profile matches a URL against a category, custom list, or
  PAN-DB classification.

  Per-dispatch customization via cef_extension_overrides / cef_header_overrides.
  See `traffic-cef.yaml` for architecture rationale.

  Source-of-truth:
    - PAN-OS 10.0 CEF Configuration Guide:
        https://docs.paloaltonetworks.com/content/dam/techdocs/en_US/pdf/cef/pan-os-10-0-cef-configuration-guide.pdf

  Wire shape:
    CEF:0|Palo Alto Networks|PAN-OS|<ver>|url|URL|<sev>|<ext>

format: cef
transport: [udp_syslog, tcp_syslog, file, beats]

ocsf:
  class: web_resource_access_activity
  category_uid: 6
  class_uid: 6004

cef_header:
  device_vendor:  "Palo Alto Networks"
  device_product: "PAN-OS"
  device_version: "10.0.0"
  signature_id:   "url"
  name:           "URL"
  severity:       3

cef_mapping:
  - { pa_field: receive_time,        cef_key: rt }
  - { pa_field: serial,              cef_key: deviceExternalId }
  - { pa_field: src_ip,              cef_key: src }
  - { pa_field: dst_ip,              cef_key: dst }
  - { pa_field: rule_name,           cef_key: PanOSRuleName }
  - { pa_field: src_user,            cef_key: suser }
  - { pa_field: application,         cef_key: app }
  - { pa_field: virtual_system,      cef_key: PanOSVsys }
  - { pa_field: src_zone,            cef_key: PanOSSrcZone }
  - { pa_field: dst_zone,            cef_key: PanOSDstZone }
  - { pa_field: session_id,          cef_key: externalId }
  - { pa_field: src_port,            cef_key: spt }
  - { pa_field: dst_port,            cef_key: dpt }
  - { pa_field: protocol,            cef_key: proto }
  - { pa_field: action,              cef_key: act }
  - { pa_field: url,                 cef_key: request }
  - { pa_field: url_category,        cef_key: cat }
  - { pa_field: http_method,         cef_key: requestMethod }
  - { pa_field: user_agent,          cef_key: requestClientApplication }
  - { pa_field: referer,             cef_key: requestContext }
  - { pa_field: src_country,         cef_key: PanOSSrcLocation }
  - { pa_field: dst_country,         cef_key: PanOSDstLocation }

params:
  hostname: { default: "PA-VM-01.example.local" }
  serial:   { default: "001234567890" }
  src_cidr: { default: "10.50.0.0/24" }
  dst_pool:
    default:
      - "151.101.1.140"
      - "104.18.32.7"
      - "172.217.27.142"
      - "157.240.22.35"
      - "203.0.113.99"

fields:
  - { name: pri, type: fixed, value: 134 }
  - { name: rfc3164_ts, type: datetime, format: "%b %d %Y %H:%M:%S" }
  - { name: hostname, type: param, param: hostname }

  - { name: receive_time, type: datetime, format: "%b %d %Y %H:%M:%S" }
  - { name: serial, type: param, param: serial }
  - name: src_ip
    type: cidr
    cidr: ${params.src_cidr}
  - name: dst_ip
    type: choice
    choices: ${params.dst_pool}
  - name: rule_name
    type: weighted_choice
    choices:
      "outbound-web": 0.50
      "guest-net":    0.20
      "any-allow":    0.20
      "block-bad":    0.10
  - name: src_user
    type: weighted_choice
    choices:
      "":                  0.60
      'CORP\alice':        0.15
      'CORP\bob':          0.15
      'CORP\svc-deploy':   0.10
  - name: application
    type: weighted_choice
    choices: { "web-browsing": 0.65, "ssl": 0.30, "ms-office365": 0.05 }
  - { name: virtual_system, type: fixed, value: "vsys1" }
  - name: src_zone
    type: weighted_choice
    choices: { trust: 0.85, guest: 0.15 }
  - name: dst_zone
    type: fixed
    value: "untrust"
  - { name: session_id, type: int_range, min: 100000, max: 9999999 }
  - { name: src_port, type: int_range, min: 1024, max: 65535 }
  - name: dst_port
    type: weighted_choice
    choices: { "443": 0.70, "80": 0.30 }
  - { name: protocol, type: fixed, value: "tcp" }
  - name: action
    type: weighted_choice
    choices: { "allow": 0.65, "block-url": 0.15, "alert": 0.15, "continue": 0.05 }
  - name: url
    type: weighted_choice
    choices:
      "www.google.com/search?q=panos+cef":           0.20
      "github.com/owner/repo":                       0.15
      "www.facebook.com/login":                       0.10
      "phishing-site.example.org/login":              0.10
      "evil.example.com/malware.exe":                 0.10
      "stackoverflow.com/questions/12345":            0.10
      "raw.malicious.example.io/exploit.bin":         0.10
      "cdn.contoso.example.com/static/main.js":       0.15
  - name: url_category
    type: weighted_choice
    choices:
      "search-engines":             0.20
      "computer-and-internet-info": 0.20
      "social-networking":          0.10
      "phishing":                   0.10
      "malware":                    0.10
      "content-delivery-networks":  0.10
      "business-and-economy":       0.10
      "newly-registered-domain":    0.10
  - name: http_method
    type: weighted_choice
    choices: { GET: 0.70, POST: 0.25, PUT: 0.03, DELETE: 0.02 }
  - name: user_agent
    type: weighted_choice
    choices:
      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0": 0.50
      "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_2) Safari/605.1.15":                  0.20
      "Mozilla/5.0 (iPhone; CPU iPhone OS 17_2) AppleWebKit/605.1.15":                 0.10
      "curl/8.4.0":                                                                    0.10
      "python-requests/2.31.0":                                                        0.10
  - name: referer
    type: weighted_choice
    choices:
      "":                                  0.50
      "https://www.google.com/":           0.20
      "https://duckduckgo.com/":           0.10
      "https://example.com/dashboard":     0.10
      "https://github.com/":               0.10
  - name: src_country
    type: weighted_choice
    choices: { TW: 0.85, US: 0.10, CN: 0.05 }
  - name: dst_country
    type: weighted_choice
    choices: { US: 0.55, TW: 0.20, IE: 0.10, NL: 0.05, DE: 0.05, JP: 0.05 }

template: |-
  <{{pri}}>{{rfc3164_ts}} {{hostname}} CEF:0|{{cef_header.device_vendor}}|{{cef_header.device_product}}|{{cef_header.device_version}}|{{cef_header.signature_id}}|{{cef_header.name}}|{{cef_header.severity}}|{{cef_extensions}}
