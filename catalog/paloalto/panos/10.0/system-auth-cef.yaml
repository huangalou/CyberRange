vendor: paloalto
product: panos
version: "10.0"
log_type: system.auth.cef
description: |
  PAN-OS 10.0 System log for administrator authentication to the
  firewall's management plane, emitted in CEF format:

    * event id `auth-fail`    — severity medium
    * event id `auth-success` — severity informational

  One catalog covers both because rules about management access need the
  pair: a burst of failures, and the success that may follow from the
  same source. `outcome` selects which event is emitted; the event id,
  severity and description follow it. Pin it with
  `--param outcome=failed` (or `success`) and use --burst to shape the
  rate.

  CEF layout follows the System custom format in the PAN-OS 10.0 CEF
  Configuration Guide:

    CEF:0|Palo Alto Networks|PAN-OS|$sender_sw_version|$subtype|$type|$number-of-severity|
      rt=$cef-formatted-receive_time deviceExternalId=$serial
      cs3Label=Virtual System cs3=$vsys fname=$object
      flexString2Label=Module flexString2=$module msg=$opaque
      externalId=$seqno cat=$eventid PanOSDGl1..4 PanOSVsysName
      dvchost=$device_name PanOSActionFlags=$actionflags
      PanOSTimeGeneratedHighResolution=$high_res_timestamp

  Note the header mapping: Signature ID is the *subtype* and Name is the
  log *type* (always SYSTEM); the event id itself travels in `cat`.

  Two points to check against your own device before relying on them:
    * subtype / module. The System log field reference lists `auth` as a
      Module value (valid when the subtype is `general`) and does not
      list it as a subtype, while firewalls are commonly seen emitting
      subtype `auth` with module `general` for these events. Both are
      params; the defaults follow the latter.
    * The description text (`msg`) is representative of the firewall's
      wording, not taken from a reference table. If a rule matches on
      the exact text, pin `opaque` together with `outcome`.

  Pin the driver, not what it drives: the event id (`cat`), the header
  severity and the description are derived from `outcome`. Pinning
  `eventid` or `opaque` on its own leaves the rest following a random
  outcome. `outcome` takes exactly `success` or `failed`.

  Source of truth:
    - PAN-OS 10.0 CEF Configuration Guide (System custom format, prefix
      field table):
        https://docs.paloaltonetworks.com/content/dam/techdocs/en_US/pdf/cef/pan-os-10-0-cef-configuration-guide.pdf
    - PAN-OS Administrator's Guide — Syslog Field Descriptions, System
      Log Fields (field meanings, severity values):
        https://docs.paloaltonetworks.com/pan-os/10-1/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/system-log-fields

format: cef
transport: [udp_syslog, tcp_syslog, file]

ocsf:
  class: authentication
  category_uid: 3
  class_uid: 3002

detections:
  wazuh: []
  sigma: []
  elk_detection: []

mythos_alignment:
  risk_refs: []
  pa_refs: []

cef_header:
  device_vendor:  "Palo Alto Networks"
  device_product: "PAN-OS"
  device_version: "10.0.0"
  name:           "SYSTEM"

cef_mapping:
  - { pa_field: receive_time,   cef_key: rt }
  - { pa_field: serial,         cef_key: deviceExternalId }
  - { pa_field: cs3_label,      cef_key: cs3Label }
  - { pa_field: vsys,           cef_key: cs3 }
  - { pa_field: object,         cef_key: fname }
  - { pa_field: module_label,   cef_key: flexString2Label }
  - { pa_field: module,         cef_key: flexString2 }
  - { pa_field: opaque,         cef_key: msg }
  - { pa_field: seqno,          cef_key: externalId }
  - { pa_field: eventid,        cef_key: cat }
  - { pa_field: dg_hier_level_1, cef_key: PanOSDGl1 }
  - { pa_field: dg_hier_level_2, cef_key: PanOSDGl2 }
  - { pa_field: dg_hier_level_3, cef_key: PanOSDGl3 }
  - { pa_field: dg_hier_level_4, cef_key: PanOSDGl4 }
  - { pa_field: vsys_name,      cef_key: PanOSVsysName }
  - { pa_field: device_name,    cef_key: dvchost }
  - { pa_field: actionflags,    cef_key: PanOSActionFlags }
  - { pa_field: high_res_timestamp, cef_key: PanOSTimeGeneratedHighResolution }

params:
  hostname: { default: "PA-VM-01.example.local" }
  serial:   { default: "001234567890" }
  subtype:  { default: "auth" }
  module:   { default: "general" }
  src_pool:  { default: ["198.51.100.23", "198.51.100.77", "203.0.113.9"] }
  user_pool: { default: ["admin", "administrator", "root", "netops"] }
  outcome_weights: { default: { failed: 0.7, success: 0.3 } }

fields:
  - name: outcome
    type: weighted_choice
    choices: ${params.outcome_weights}

  - { name: pri, type: fixed, value: 134 }
  - { name: rfc3164_ts, type: datetime, format: "%b %d %Y %H:%M:%S" }
  - { name: hostname, type: param, param: hostname }

  - { name: receive_time, type: datetime, format: "%b %d %Y %H:%M:%S" }
  - { name: serial, type: param, param: serial }
  - { name: subtype, type: param, param: subtype }
  - { name: cs3_label, type: fixed, value: "Virtual System" }
  - { name: vsys, type: fixed, value: "" }

  - name: object
    type: choice
    choices: ${params.user_pool}

  - name: src_ip
    type: choice
    choices: ${params.src_pool}

  - { name: module_label, type: fixed, value: "Module" }
  - { name: module, type: param, param: module }

  - name: eventid
    type: template
    template: "{{ 'auth-success' if outcome == 'success' else 'auth-fail' }}"

  # $number-of-severity: informational=1, low=2, medium=3, high=4, critical=5
  - name: severity_num
    type: template
    template: "{{ 1 if outcome == 'success' else 3 }}"

  - name: opaque
    type: template
    template: >-
      {%- if outcome == 'success' -%}
      authenticated for user '{{ object }}'. From: {{ src_ip }}.
      {%- else -%}
      failed authentication for user '{{ object }}'. Reason: Invalid username/password. From: {{ src_ip }}.
      {%- endif -%}

  - { name: seqno, type: int_range, min: 1000000, max: 99999999 }
  - { name: dg_hier_level_1, type: fixed, value: 0 }
  - { name: dg_hier_level_2, type: fixed, value: 0 }
  - { name: dg_hier_level_3, type: fixed, value: 0 }
  - { name: dg_hier_level_4, type: fixed, value: 0 }
  - { name: vsys_name, type: fixed, value: "" }
  - { name: device_name, type: template, template: "{{ hostname.split('.')[0] }}" }
  - { name: actionflags, type: fixed, value: "0x0" }
  - { name: high_res_timestamp, type: datetime, format: "%Y-%m-%dT%H:%M:%S.%f+00:00" }

template: |-
  <{{pri}}>{{rfc3164_ts}} {{hostname}} CEF:0|{{cef_header.device_vendor}}|{{cef_header.device_product}}|{{cef_header.device_version}}|{{subtype}}|{{cef_header.name}}|{{severity_num}}|{{cef_extensions}}

regression:
  baseline_alert_count: 0
  baseline_ttd_ms: 5000
