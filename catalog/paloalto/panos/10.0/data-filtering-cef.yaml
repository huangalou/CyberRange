vendor: paloalto
product: panos
version: "10.0"
log_type: data-filtering-cef
description: |
  PAN-OS 10.0 Data Filtering log emitted in CEF. Generated when a
  Data Filtering Security Profile matches a data pattern (CC numbers,
  SSN, PII regex, custom dictionary) in transmitted content.

  Per-dispatch customization via cef_extension_overrides /
  cef_header_overrides; see `traffic-cef.yaml`.

  Source-of-truth:
    - PAN-OS 10.0 CEF Configuration Guide:
        https://docs.paloaltonetworks.com/content/dam/techdocs/en_US/pdf/cef/pan-os-10-0-cef-configuration-guide.pdf

format: cef
transport: [udp_syslog, tcp_syslog, file, beats]

ocsf:
  class: security_finding
  category_uid: 2
  class_uid: 2004

cef_header:
  device_vendor:  "Palo Alto Networks"
  device_product: "PAN-OS"
  device_version: "10.0.0"
  signature_id:   "data"
  name:           "DATA"
  severity:       5

cef_mapping:
  - { pa_field: receive_time,       cef_key: rt }
  - { pa_field: serial,             cef_key: deviceExternalId }
  - { pa_field: src_ip,             cef_key: src }
  - { pa_field: dst_ip,             cef_key: dst }
  - { pa_field: rule_name,          cef_key: PanOSRuleName }
  - { pa_field: src_user,           cef_key: suser }
  - { pa_field: application,        cef_key: app }
  - { pa_field: virtual_system,     cef_key: PanOSVsys }
  - { pa_field: session_id,         cef_key: externalId }
  - { pa_field: src_port,           cef_key: spt }
  - { pa_field: dst_port,           cef_key: dpt }
  - { pa_field: protocol,           cef_key: proto }
  - { pa_field: action,             cef_key: act }
  - { pa_field: data_pattern_name,  cef_key: cs1 }
  - { pa_field: data_pattern_count, cef_key: cn1 }
  - { pa_field: pa_severity,        cef_key: PanOSDataSeverity }
  - { pa_field: direction,          cef_key: PanOSDirection }
  - { pa_field: file_name,          cef_key: fname }
  - { pa_field: file_hash,          cef_key: fileHash }

params:
  hostname: { default: "PA-VM-01.example.local" }
  serial:   { default: "001234567890" }
  src_cidr: { default: "10.50.0.0/24" }
  dst_pool:
    default:
      - "104.244.42.193"
      - "151.101.1.140"
      - "203.0.113.99"

fields:
  - { name: pri, type: fixed, value: 134 }
  - { name: rfc3164_ts, type: datetime, format: "%b %d %Y %H:%M:%S" }
  - { name: hostname, type: param, param: hostname }

  - { name: receive_time, type: datetime, format: "%b %d %Y %H:%M:%S" }
  - { name: serial, type: param, param: serial }
  - name: src_ip
    type: cidr
    cidr: ${params.src_cidr}
  - name: dst_ip
    type: choice
    choices: ${params.dst_pool}
  - name: rule_name
    type: weighted_choice
    choices: { "dlp-outbound": 0.60, "dmz-to-inside": 0.20, "block-pii": 0.20 }
  - name: src_user
    type: weighted_choice
    choices:
      "":                  0.40
      'CORP\alice':        0.20
      'CORP\bob':          0.20
      'CORP\svc-deploy':   0.20
  - name: application
    type: weighted_choice
    choices: { "smtp": 0.35, "web-browsing": 0.30, "ssl": 0.20, "ftp": 0.15 }
  - { name: virtual_system, type: fixed, value: "vsys1" }
  - { name: session_id, type: int_range, min: 100000, max: 9999999 }
  - { name: src_port, type: int_range, min: 1024, max: 65535 }
  - name: dst_port
    type: weighted_choice
    choices: { "443": 0.40, "25": 0.30, "80": 0.20, "21": 0.10 }
  - { name: protocol, type: fixed, value: "tcp" }
  - name: action
    type: weighted_choice
    choices: { "alert": 0.60, "block": 0.30, "continue": 0.10 }
  - name: data_pattern_name
    type: weighted_choice
    choices:
      "Credit-Card-Number-PCI":   0.30
      "SSN-US":                   0.25
      "Taiwan-ID-Number":         0.20
      "Email-Bulk-Export":        0.10
      "API-Key-Exposure":         0.10
      "Custom-Dict-Confidential": 0.05
  - { name: data_pattern_count, type: int_range, min: 1, max: 50 }
  - name: pa_severity
    type: weighted_choice
    choices: { "high": 0.40, "medium": 0.40, "low": 0.15, "critical": 0.05 }
  - name: direction
    type: weighted_choice
    choices: { "client-to-server": 0.80, "server-to-client": 0.20 }
  - name: file_name
    type: weighted_choice
    choices:
      "customer_list.csv": 0.30
      "payroll.xlsx":      0.25
      "report.pdf":        0.20
      "backup.zip":        0.15
      "secrets.env":       0.10
  - name: file_hash
    type: weighted_choice
    choices:
      "":  0.40
      "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef": 0.30
      "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210": 0.30

template: |-
  <{{pri}}>{{rfc3164_ts}} {{hostname}} CEF:0|{{cef_header.device_vendor}}|{{cef_header.device_product}}|{{cef_header.device_version}}|{{cef_header.signature_id}}|{{cef_header.name}}|{{cef_header.severity}}|{{cef_extensions}}
