vendor: aws
product: cloudtrail
version: "2.0"
log_type: cloudtrail.credential_abuse.teampcp
description: |
  AWS CloudTrail event observing stolen-credential abuse from TeamPCP
  infrastructure. Models the cloud control-plane footprint of the
  Telnyx 4.87.x WAV-stego payload: after the WAV second-stage decodes
  and exfiltrates the victim host's AWS access keys to
  `83.142.209.203:8080/`, the attacker invokes AWS APIs directly from
  that same infra (and adjacent boxes) to enumerate identity, pivot,
  and stage data exfiltration.

  Per Datadog Security Labs advisory:
    "Python-urllib* detected in cloud credential access attempts
     (CloudTrail, Kubernetes API queries)"
  This catalog is the CloudTrail side of that observation.

  Schema v3 sixth canonical example — completes the 6-axis TeamPCP
  detection-coverage set. Sibling catalogs:
    - Sysmon EID 3 NetworkConnect — endpoint egress (domains + ips)
    - auditd file-create         — Linux FS persistence (file_paths)
    - k8s-audit DaemonSet        — k8s control plane (User-Agent UA sub-axis)
    - auditd EXECVE pip-install  — Linux entry point (process argv)
    - FortiGate UTM webfilter    — perimeter HTTP (URI-path + X-Filename)
    - THIS                       — cloud control plane (stolen-cred API calls)
  Together: endpoint / host / k8s / cloud / network-perimeter — 5
  vendor dimensions, all keyed on the same `package_versions` root
  cause, all ingested from the single Datadog advisory.

  Reference: see the CTI advisory (Datadog Security Labs) cited in the
  `cti:` block below.

  ─── Wire-format fidelity (audited 2026-05-15 against AWS docs) ───
  - eventVersion = "1.11" (current per AWS CloudTrail User Guide,
    "Record contents for management, data, and network activity events";
    1.11 introduces `eventContext`. We do NOT emit eventContext because
    this catalog targets trails delivered to S3 / Event history, not
    enriched event data stores).
  - Wire envelope: when delivered to S3, CloudTrail writes a single
    gzipped object containing {"Records": [ {...}, {...}, ... ]}.
    For SIEM ingest (Beats / fluentbit / Sentinel AMA / Splunk Add-on),
    the array is split client-side and re-emitted as ONE-JSON-PER-LINE.
    This catalog emits one event per render — the JSONL form a SIEM
    actually sees on the wire (filebeat with `decode_json_fields` +
    explicit `Records[*]` flatten, or Splunk TA-aws-cloudtrail).
    If a downstream consumer needs the S3-batch form, wrap N renders in
    `{"Records":[ ... ]}` at sink time — out of scope for this catalog.
  - principalId for IAMUser is INDEPENDENT of accessKeyId. AWS unique
    IDs use prefixes per IAM docs: `AIDA` (user), `AROA` (role),
    `AKIA` (long-term access key), `ASIA` (temp credentials). The
    principalId is the user's permanent unique ID, NOT derived from
    the access key. Catalog now emits a separate AIDA pool.
  - accessKeyId is exactly 20 chars (16 chars after the `AKIA` prefix).
  - sessionContext is present on IAMUser events too (with empty
    `sessionIssuer` and `webIdFederationData`) per real EC2/IAM examples
    in the CloudTrail log file examples page.
  - tlsDetails is present from eventVersion 1.08+.

format: json
transport: [beats, file]      # CloudTrail → S3 → fluentbit/filebeat → ES

ocsf:
  class: api_activity
  category_uid: 6
  class_uid: 6003

# ──────────────── DetectOps v2 metadata ────────────────
# Detection pivots:
#   (a) sourceIPAddress IN TeamPCP infra IP list                → P0
#   (b) userAgent contains Python-urllib AND eventName ∈        → P1
#       {GetCallerIdentity, ListAccessKeys, AssumeRole}
#   (c) accessKeyId observed making API call from new geo within → P0
#       30min of victim host outbound to same IP
# (a) is the strongest single-event indicator and will be the primary
# detection. (b)+(c) are correlated detections covering UA-only or
# geo-anomaly variants where source IP rotates.
detections:
  wazuh:
    # 2026-05-21 Sibling 5 落地:<soc-repo>/config/wazuh_manager/rules/
    #   local_aws_cloudtrail_teampcp.xml(commit pending)。
    # Chain rule pattern(對齊 Sibling 1 sysmon 雙軸):
    #   132059 anchor (level 0) + 132060 source_ip 軸 + 132061 UA+eventName 軸。
    # Stock decoder: phase 2 stock `json` decoder 完美抽 CloudTrail field
    #   (sourceIPAddress / userAgent / eventName 等);rule 仍走 raw
    #   <match type=pcre2> 求 wire-form-independence。
    - decoder: json                    # stock json decoder phase 2 命中
    - rule_id: 132059                  # anchor level 0,對 `"eventVersion":"` 命中
      level: 0
    - rule_id: 132060                  # source_ip 軸 — TeamPCP 3 infra IP
      level: 12
    - rule_id: 132061                  # UA+eventName 軸 — Python-urllib + 6 scenario API
      level: 12
  sigma:
    - rule: aws_susp_creds_from_known_bad_ip
      ref: TBD
    - rule: aws_get_caller_identity_from_python_urllib
      ref: TBD
  elk_detection:
    - kibana_rule_id: aws-teampcp-credential-abuse
      severity: critical
    - kibana_rule_id: aws-teampcp-pythonurllib-iam-enum
      severity: high

mythos_alignment:
  # R1 Accelerated Threat Exploitation — cloud control plane is where
  #   PyPI compromise turns into a multi-tenant blast radius within
  #   minutes of credential theft. R10 Threat Detection Lagging
  #   Intelligence — TeamPCP infra IPs are exactly the kind of cloud-
  #   side IOC that lags weeks behind in commercial CTI feeds.
  risk_refs: [R1, R10]
  # PA1 Point Agents at Code (CloudTrail event-bus consumer matches IOC)
  # PA5 Continuous Patching (after PyPI quarantine, must verify the
  #   CloudTrail IOC-match rule still alerts on backfilled events from
  #   victim hosts that may have shipped 1.82.7/4.87.x before patch)
  pa_refs: [PA1, PA5]
  ttx_class: rapid

regression:
  # 6 weighted scenarios, every render carries one TeamPCP infra
  # sourceIPAddress → 100% should match the primary detection rule.
  # baseline_ttd higher than other catalogs: CloudTrail S3 → SIEM
  # ingest pipeline is typically 30-90s, not real-time.
  baseline_alert_count: 100
  baseline_ttd_ms: 60000

  # 2026-05-21 Sibling 5 fixture-only logtest baseline(無 AWS 環境 live-fire 條件,
  # 需要 AWS account + CloudTrail trail 寫 S3 + SQS notification + ArcSight
  # SmartConnector 或 filebeat aws module + Wazuh integration)。
  live_fire_pending: true
  logtest_baseline:
    fixture_dir: tests/fixtures/wazuh-logtest/cloudtrail-credential-abuse-teampcp/
    fixture_count: 4
    fire_summary:
      "132060 (source_ip 軸)": "3/4(sample 1, 3, 4)"
      "132061 (UA+eventName 軸)": "1/4(sample 2;sample 3 被 first-match starve)"
    finding_first_match_starve: |
      sample 3 雙軸 IOC 可交集(TeamPCP IP + Python-urllib + AssumeRole)同時命中時,
      Wazuh chain rule first-match termination 行為 → 只 fire 排序在前的 132060,
      132061 starve。這對齊 Wazuh sibling rule 的 first-match-wins 行為
      (同一 chain anchor 下多個 child rule 同時命中時,只有排序在前的會 fire)。
      SOC 角度 OK(P0 IP 軸贏,attacker 不會逃);但雙軸命中 alert 數 = 1 而非 2,
      影響 metric 計算。Sprint 2 root-cause investigation 含此 finding。
    iot_baseline_unblock_note: |
      logtest 跑通前需先修 <soc-repo>/config/wazuh_manager/rules/local_iot_baseline.xml
      (2026-05-21 noise sweep 引入的 native <dstip> pipe alternation syntax error
      → CRITICAL 1220 → 整個 rule set fail load)。改用 <list> lookup 對齊 114001
      pattern,引用既有 etc/lists/known-dns-servers(9 IP 內容跟原 inline 一致)。

# ──────────────── v3: CTI advisory provenance + IOCs ────────────────
cti:
  source: datadog-security-labs
  source_url: https://securitylabs.datadoghq.com/articles/litellm-compromised-pypi-teampcp-supply-chain-campaign/
  advisory_id: PYSEC-2026-2
  ingested_at: "2026-05-12"
  related_campaign: teampcp
  cve_refs: []
  iocs:
    # Cloud control-plane IOCs. Two cross-axis references with siblings:
    #   - `ips` (3 TeamPCP infra IPs) is also held by Sysmon EID 3, but
    #     here renders as `sourceIPAddress` (API caller role), not
    #     `destination` of endpoint outbound. Cross-catalog correlation
    #     joins on the same value across these two semantic roles.
    #   - `User-Agent: Python-urllib*` is also held by k8s-audit, but
    #     here is the stolen-cred CLI's UA, not the k8s DaemonSet
    #     creator. Same string, different attacker role.
    # The duplication is intentional: 6/6 axis-coverage is about which
    # log surface fires the detection, not which IOC bundle uniquely
    # owns each value.
    ips:
      - 83.142.209.203
      - 83.142.209.11
      - 46.151.182.203
    http_fingerprints:
      - { header: User-Agent, value: "Python-urllib*" }
      - { header: User-Agent, value: "Boto3*" }
      - { header: User-Agent, value: "aws-cli/2*" }
    package_versions:
      - { ecosystem: pypi, name: litellm, versions: ["1.82.7", "1.82.8"] }
      - { ecosystem: pypi, name: telnyx,  versions: ["4.87.1", "4.87.2"] }
    # No domains (CloudTrail event does not carry reverse-DNS hostname
    # — sibling Sysmon EID 3 owns the domains axis). No file_paths /
    # file_hashes — cloud control plane has no filesystem surface.

# ──────────────── v3: VulnOps reverse-lookup ────────────────
vulnops:
  cve_refs: []
  affects:
    - { vendor: pypi, product: litellm, version_range: "1.82.7,1.82.8" }
    - { vendor: pypi, product: telnyx,  version_range: "4.87.1,4.87.2" }
  patch_signal:
    - "litellm 1.82.7 / 1.82.8 quarantined on PyPI"
    - "telnyx 4.87.1 / 4.87.2 quarantined on PyPI"
  regression_critical: true            # P0: cloud-side credential abuse

params:
  aws_account_id: { default: "123456789012" }
  aws_region:     { default: "us-west-2" }
  victim_iam:     { default: "dev-laptop-04" }

fields:
  - name: ts_iso
    type: datetime
    format: "%Y-%m-%dT%H:%M:%SZ"

  - name: session_creation_iso
    type: datetime
    format: "%Y-%m-%dT%H:%M:%SZ"

  - name: event_id
    type: faker
    method: uuid4

  - name: request_id
    type: faker
    method: uuid4

  # 6 weighted scenarios spanning the typical post-credential-theft
  # enumeration + lateral chain a stolen IAM key would exercise.
  - name: scenario
    type: weighted_choice
    choices:
      get_caller_identity:  0.30   # sts:GetCallerIdentity — cred validation, runs first
      list_access_keys:     0.20   # iam:ListAccessKeys — post-compromise IAM enum
      assume_role:          0.20   # sts:AssumeRole — privilege escalation
      describe_instances:   0.15   # ec2:DescribeInstances — lateral recon
      get_secret_value:     0.10   # secretsmanager:GetSecretValue — next-stage cred
      list_buckets:         0.05   # s3:ListBuckets — data discovery

  - name: source_ip
    type: weighted_choice
    choices:
      "83.142.209.203": 0.5
      "83.142.209.11":  0.3
      "46.151.182.203": 0.2

  # Real-world userAgent strings from credential-abuse traffic. The
  # `aws-cli/2.x` and `Boto3/1.x` forms match the AWS doc's example
  # template (`aws-cli/<ver> Python/<ver> <OS>/<kernel> source/<arch>`).
  # `Python-urllib/3.12` is the Datadog advisory's named IOC — what
  # you see when an attacker calls IAM/STS endpoints directly with the
  # stdlib HTTP client instead of an SDK, bypassing UA randomization.
  - name: user_agent
    type: weighted_choice
    choices:
      "aws-cli/2.15.0 Python/3.11.7 Linux/5.15.0-92-generic source/x86_64.ubuntu.22 prompt/off command/sts.get-caller-identity": 0.35
      "Boto3/1.34.0 md/Botocore#1.34.0 ua/2.0 os/linux#6.5.0 md/arch#x86_64 lang/python#3.12.1 cfg/retry-mode#standard Botocore/1.34.0": 0.30
      "Python-urllib/3.12": 0.35

  - name: event_name
    type: template
    template: |-
      {%- if scenario == 'get_caller_identity' -%}GetCallerIdentity
      {%- elif scenario == 'list_access_keys' -%}ListAccessKeys
      {%- elif scenario == 'assume_role' -%}AssumeRole
      {%- elif scenario == 'describe_instances' -%}DescribeInstances
      {%- elif scenario == 'get_secret_value' -%}GetSecretValue
      {%- else -%}ListBuckets
      {%- endif -%}

  - name: event_source
    type: template
    template: |-
      {%- if scenario in ['get_caller_identity', 'assume_role'] -%}sts.amazonaws.com
      {%- elif scenario == 'list_access_keys' -%}iam.amazonaws.com
      {%- elif scenario == 'describe_instances' -%}ec2.amazonaws.com
      {%- elif scenario == 'get_secret_value' -%}secretsmanager.amazonaws.com
      {%- else -%}s3.amazonaws.com
      {%- endif -%}

  # tlsDetails.clientProvidedHostHeader is the regional service endpoint
  # FQDN the SDK opened the TLS connection to. Track it from event_source
  # so the FQDN matches the called API.
  - name: tls_host_header
    type: template
    template: |-
      {%- if scenario in ['get_caller_identity', 'assume_role'] -%}sts.{{params.aws_region}}.amazonaws.com
      {%- elif scenario == 'list_access_keys' -%}iam.amazonaws.com
      {%- elif scenario == 'describe_instances' -%}ec2.{{params.aws_region}}.amazonaws.com
      {%- elif scenario == 'get_secret_value' -%}secretsmanager.{{params.aws_region}}.amazonaws.com
      {%- else -%}s3.{{params.aws_region}}.amazonaws.com
      {%- endif -%}

  # Stolen access keys — `AKIA` prefix per AWS access key id format.
  # Each value is exactly 20 chars (4-char prefix + 16 chars). The
  # canonical AWS doc example is `AKIAIOSFODNN7EXAMPLE` (20 chars).
  - name: stolen_access_key
    type: weighted_choice
    choices:
      "AKIAIOSFODNN7EXAMPLE":   0.34
      "AKIAA4ZGZ52BNS6MFEXAM":  0.33
      "AKIAWJALRXUTNFEXAMPL":   0.33

  # principalId for IAMUser is INDEPENDENT of accessKeyId. Real format
  # is `AIDA` + 16 chars (the user's permanent IAM unique ID). The
  # `*EXAMPLE` suffix matches the AWS doc convention. Three values
  # cycled to model three victim laptops sharing the same IAM role.
  - name: principal_id
    type: weighted_choice
    choices:
      "AIDAJ45Q7YFFAREXAMPLE":  0.34
      "AIDA6ON6E4XEGIEXAMPLE":  0.33
      "AIDA6ON6E4XEGITEXAMPL":  0.33

  # Most stolen-cred calls succeed (creds were just exfiltrated, still
  # valid). 30% fail with permission/session errors that an attacker
  # probes for. errorCode == "OK" is the success sentinel — template
  # conditional omits the errorCode/errorMessage fields entirely in
  # that case. errorMessage strings are realistic AWS service responses.
  - name: error_code
    type: weighted_choice
    choices:
      "OK":                     0.70
      "AccessDenied":           0.15
      "InvalidClientTokenId":   0.10
      "ExpiredToken":           0.05

  - name: error_message
    type: template
    template: |-
      {%- if error_code == 'AccessDenied' -%}User: arn:aws:iam::{{params.aws_account_id}}:user/{{params.victim_iam}} is not authorized to perform: {{event_source|replace('.amazonaws.com','')}}:{{event_name}} on resource: *
      {%- elif error_code == 'InvalidClientTokenId' -%}The security token included in the request is invalid.
      {%- elif error_code == 'ExpiredToken' -%}The security token included in the request is expired
      {%- else -%}
      {%- endif -%}

  - name: read_only
    type: template
    template: |-
      {%- if scenario == 'assume_role' -%}false
      {%- else -%}true
      {%- endif -%}

# CloudTrail event in standard JSON envelope (eventVersion 1.11). Carries
# every dimension a SOC needs to pivot: account, region, sourceIPAddress
# (= TeamPCP infra IOC), userAgent (stolen-cred CLI UA), eventName (which
# AWS API was called with stolen cred), accessKeyId pattern, and an
# optional errorCode for the failure variants. CloudTrail ships line-
# delimited JSON via S3 → SIEM pipelines (filebeat/fluentbit common).
# sessionContext + tlsDetails are present per real EC2/IAM examples in
# the AWS doc "CloudTrail log file examples" page.
template: |-
  {"eventVersion":"1.11","userIdentity":{"type":"IAMUser","principalId":"{{principal_id}}","arn":"arn:aws:iam::{{params.aws_account_id}}:user/{{params.victim_iam}}","accountId":"{{params.aws_account_id}}","accessKeyId":"{{stolen_access_key}}","userName":"{{params.victim_iam}}","sessionContext":{"sessionIssuer":{},"webIdFederationData":{},"attributes":{"creationDate":"{{session_creation_iso}}","mfaAuthenticated":"false"}}},"eventTime":"{{ts_iso}}","eventSource":"{{event_source}}","eventName":"{{event_name}}","awsRegion":"{{params.aws_region}}","sourceIPAddress":"{{source_ip}}","userAgent":"{{user_agent}}"{% if error_code != 'OK' %},"errorCode":"{{error_code}}","errorMessage":"{{error_message}}"{% endif %},"requestParameters":null,"responseElements":null,"requestID":"{{request_id}}","eventID":"{{event_id}}","readOnly":{{read_only}},"eventType":"AwsApiCall","managementEvent":true,"recipientAccountId":"{{params.aws_account_id}}","eventCategory":"Management","tlsDetails":{"tlsVersion":"TLSv1.2","cipherSuite":"ECDHE-RSA-AES128-GCM-SHA256","clientProvidedHostHeader":"{{tls_host_header}}"}}
