vendor: aws
product: cloudtrail
version: "2.0"
log_type: cloudtrail.credential_abuse.teampcp-cef
description: |
  AWS CloudTrail credential-abuse event AFTER an upstream transform has
  re-emitted it as ArcSight Common Event Format (CEF). This is the wire
  form that arrives at SIEMs running ArcSight ESM / ArcSight Logger or
  any CEF-only ingest path (Splunk Connect for Syslog, Microsoft
  Sentinel CEF-via-AMA, IBM QRadar CEF DSM, Securonix, etc.).

  Sibling catalog (same event, NATIVE wire form):
    catalog/aws/cloudtrail/2.0/credential-abuse-teampcp.yaml

  IMPORTANT — AWS CloudTrail does NOT emit CEF natively. CloudTrail
  always writes JSON records to S3 (single Gzipped object containing
  {"Records":[ {...}, ... ]}); CEF only appears after one of these
  upstream re-emitters has parsed the JSON record and re-shaped it:

    1. ArcSight SmartConnector for Amazon Web Services CloudTrail
       (the canonical CEF emitter — its 8.4.3 Configuration Guide
       "Amazon Web Services Mappings to ArcSight Fields" table
       on pages 25-26 defines the authoritative ArcSight-ESM-field
       to CloudTrail-JSON-field map this catalog implements). The
       SmartConnector polls SQS for SNS notifications, pulls the
       Gzipped JSON object from S3, parses each Records[] entry,
       maps to ArcSight ESM fields, and forwards CEF over syslog
       to ArcSight ESM / Logger / a downstream CEF sink.
    2. Splunk Add-on for AWS + Splunk Connect for Syslog (SC4S)
       — SC4S can be configured with a CEF re-emit transform.
    3. LogStash / Logagent / Fluent-bit with `cef` output codec
       wrapping the parsed CloudTrail JSON in a CEF header.
    4. Custom rsyslog / syslog-ng / NXLog admin-authored template
       that wraps a fetched CloudTrail record in a CEF envelope.

  This sibling exists because real SOC deployments receive the SAME
  credential-abuse event in BOTH wire forms depending on the path the
  log took to reach the SIEM:

    AWS CloudTrail → S3 → SQS  →  ArcSight SmartConnector  →
                                  CEF on TCP/514  →  Wazuh `cef`
                                  decoder OR ArcSight ESM
                                                       (THIS CATALOG)

    AWS CloudTrail → S3        →  filebeat / fluent-bit / Splunk
                                  TA-aws-cloudtrail  →  native JSON
                                  → Elasticsearch / Splunk
                                                       (NATIVE sibling)

  ─── Authoritative source URLs (fetched 2026-05-15) ───
    - ArcSight SmartConnector for Amazon Web Services CloudTrail
      Configuration Guide 8.4.3 (October 2023), pages 25-26
      "Amazon Web Services Mappings to ArcSight Fields"
      + "Amazon Web Services Mappings":
        https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors-8.4/pdfdoc/aws-cloudtrail/aws-cloudtrail.pdf
      (The COMMON mapping table applied to every CloudTrail
       event — Device Vendor='Amazon', Device Product=eventSource,
       Device Receipt Time=eventTime, Device Domain=awsRegion,
       Source Address=sourceIPAddress, Request Client
       Application=userAgent, Name=EventName, Reason=errorCode,
       Message=errorMessage, Event Outcome=one of (errorCode,
       ('Success','Failure')), Device Event Class ID=All
       of(eventName, One of('|Success','|Failure')), Source User
       Name=UserIdentity.UserName, Source User ID=userIdentity.Accountid,
       Destination User ID=recipientAccountid, Device Custom Date 1=
       userIdentity.sessionContext.attributes.creationDate,
       Device Custom Floating Point 1=eventVersion,
       Device Custom String 1=requestParameters,
       Device Custom String 2=responseElements,
       Device Custom String 3=userIdentity.sessionContext.attributes
                              .mfaAuthenticated,
       Device Payload ID=eventid,
       File ID=userIdentity.principalid,
       File Path=userIdentity.arn,
       File Permission=userIdentity.accessKeyId,
       File Type=userIdentity.Type,
       Source Process Name=userIdentity.invokedBy,
       Old File Hash/ID/Name/Path/Type=userIdentity.SessionIssuer.*,
       Request Method=eventType.)
    - Connector catalog index (vendor/product page):
        https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors/
    - Microsoft Sentinel CEF key → CommonSecurityLog field mapping
      (confirms ArcSight ESM names map 1:1 to the CEF extension
      keys we emit on wire — e.g. "Device Custom String 1"=cs1,
      "Device Custom Date 1"=deviceCustomDate1, "Source Address"=src,
      "Destination User ID"=duid, "File Permission"=filePermission,
      "Old File Hash"=oldFileHash, "Request Client Application"=
      requestClientApplication, "Event Outcome"=outcome):
        https://learn.microsoft.com/en-us/azure/sentinel/cef-name-mapping
    - Native CloudTrail JSON wire format (the source the
      SmartConnector parses BEFORE re-emitting as CEF):
        https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    - Datadog Security Labs advisory PYSEC-2026-2 — the IOC source
      for this credential-abuse scenario (TeamPCP infra IPs +
      Python-urllib User-Agent + stolen `AKIA` keys observed in
      CloudTrail post-PyPI-compromise):
        https://securitylabs.datadoghq.com/articles/litellm-compromised-pypi-teampcp-supply-chain-campaign/

  Real CEF wire-format example (composed strictly from the SmartConnector
  8.4.3 mapping table cited above; no verbatim TeamPCP customer sample
  was published — see Open Questions in companion doc aws-cloudtrail.md):

    <14>May 15 10:38:14 cloudtrail-sc.lab.local CEF:0|Amazon|sts.amazonaws.com|1.11|GetCallerIdentity|GetCallerIdentity|3|act=GetCallerIdentity outcome=Success src=83.142.209.203 suser=dev-laptop-04 suid=123456789012 duid=123456789012 fileId=AIDAJ45Q7YFFAREXAMPLE filePath=arn:aws:iam::123456789012:user/dev-laptop-04 filePermission=AKIAIOSFODNN7EXAMPLE fileType=IAMUser deviceExternalId=4f9e1c2d-3a8b-4c7e-9f1a-2b3c4d5e6f7a requestClientApplication=Python-urllib/3.12 requestMethod=AwsApiCall rt=May 15 2026 10:38:14 deviceCustomDate1=May 15 2026 10:35:00 deviceCustomDate1Label=SessionCreationDate cfp1=1.11 cfp1Label=EventVersion cs1=null cs1Label=RequestParameters cs2=null cs2Label=ResponseElements cs3=false cs3Label=MFAAuthenticated cs4=us-west-2 cs4Label=AWSRegion dproc=sts.amazonaws.com

  Detection-rule path differs from the native sibling:
    - Native JSON path: Wazuh `aws-cloudtrail` decoder + rule 80300/80370
    - CEF path: Wazuh built-in `cef` decoder (no custom decoder needed —
      SmartConnector already normalized the body into named extensions).
      Custom rule pivots on `requestClientApplication=Python-urllib*`,
      `src` IN TeamPCP infra IP list, `filePermission` (=accessKeyId)
      matching the stolen-key pool.

format: cef
transport: [udp_syslog, tcp_syslog, file, beats]

ocsf:
  class: api_activity
  category_uid: 6
  class_uid: 6003

# ──────────────── DetectOps v2 metadata ────────────────
# Same detection pivots as native sibling, but routed through CEF
# decoder path instead of `aws-cloudtrail` JSON decoder.
detections:
  wazuh:
    # 2026-05-21 Sibling 5 落地僅 JSON 變體(native sibling
    #   catalog/aws/cloudtrail/2.0/credential-abuse-teampcp.yaml → rule 132059/132060/132061)。
    # CEF 變體 rule 是 future sub-task,需獨立 rule file
    #   `local_aws_cloudtrail_teampcp_cef.xml`(預計 rule 132069 anchor + 132070
    #   src= IP 軸 + 132071 requestClientApplication=Python-urllib + act= 組合軸,
    #   對齊 ArcSight SmartConnector 8.4.3 CEF 命名)。
    # Wazuh **沒有 built-in generic `cef` decoder** — 只有 vendor-specific
    #   `cef-fireeye` 等。CEF 變體要寫 custom CEF decoder + prematch + regex
    #   + order 手刻,工作量大於 JSON 變體。
    - decoder: TBD                     # custom CEF decoder + rule pending
    - rule_id: 132069                  # future: anchor (level 0) on CEF body
      level: 0
    - rule_id: 132070                  # future: src= IP 軸
      level: 12
    - rule_id: 132071                  # future: requestClientApplication + act= 組合軸
      level: 12
  sigma:
    - rule: aws_susp_creds_from_known_bad_ip_cef
      ref: TBD
    - rule: aws_get_caller_identity_from_python_urllib_cef
      ref: TBD
  elk_detection:
    - kibana_rule_id: aws-teampcp-credential-abuse-cef
      severity: critical
    - kibana_rule_id: aws-teampcp-pythonurllib-iam-enum-cef
      severity: high

mythos_alignment:
  # Same Mythos-ready alignment as the native sibling — the CEF wire
  # form does not change R1/R10 or PA1/PA5 semantics; it only changes
  # which SIEM decoder path the detection rule attaches to.
  risk_refs: [R1, R10]
  pa_refs: [PA1, PA5]
  ttx_class: rapid

regression:
  # Same baseline expectation as native sibling — every render carries
  # one TeamPCP infra src IP, 100% should match the primary detection.
  # baseline_ttd identical: CEF re-emit adds <1s vs the S3→SIEM JSON
  # path (SmartConnector polls SQS every few seconds, but the
  # CloudTrail→S3 step still dominates end-to-end latency).
  baseline_alert_count: 100
  baseline_ttd_ms: 60000

# ──────────────── v3: CTI advisory provenance + IOCs ────────────────
# Identical IOC bundle to native sibling — IOC values are wire-format-
# independent. The stolen `AKIA` keys still observed in CloudTrail
# regardless of whether the SIEM ingests JSON or CEF; the TeamPCP infra
# IPs still appear as `src=` in CEF / `sourceIPAddress` in JSON. Only
# the field NAMES change between the two wire forms.
cti:
  source: datadog-security-labs
  source_url: https://securitylabs.datadoghq.com/articles/litellm-compromised-pypi-teampcp-supply-chain-campaign/
  advisory_id: PYSEC-2026-2
  ingested_at: "2026-05-12"
  related_campaign: teampcp
  cve_refs: []
  iocs:
    ips:
      - 83.142.209.203
      - 83.142.209.11
      - 46.151.182.203
    http_fingerprints:
      - { header: User-Agent, value: "Python-urllib*" }
      - { header: User-Agent, value: "Boto3*" }
      - { header: User-Agent, value: "aws-cli/2*" }
    package_versions:
      - { ecosystem: pypi, name: litellm, versions: ["1.82.7", "1.82.8"] }
      - { ecosystem: pypi, name: telnyx,  versions: ["4.87.1", "4.87.2"] }

# ──────────────── v3: VulnOps reverse-lookup ────────────────
vulnops:
  cve_refs: []
  affects:
    - { vendor: pypi, product: litellm, version_range: "1.82.7,1.82.8" }
    - { vendor: pypi, product: telnyx,  version_range: "4.87.1,4.87.2" }
  patch_signal:
    - "litellm 1.82.7 / 1.82.8 quarantined on PyPI"
    - "telnyx 4.87.1 / 4.87.2 quarantined on PyPI"
  regression_critical: true

params:
  aws_account_id: { default: "123456789012" }
  aws_region:     { default: "us-west-2" }
  victim_iam:     { default: "dev-laptop-04" }
  # SmartConnector syslog source host (the SC node, not AWS).
  # Appears in the RFC3164 HOSTNAME slot of the CEF wire line.
  sc_host:        { default: "cloudtrail-sc.lab.local" }

fields:
  # ─── Syslog envelope (RFC 3164 wrapper around the CEF body) ───
  # PRI 14 = local0.notice, matches ArcSight SmartConnector default
  # syslog facility/severity for CloudTrail events. SC emits syslog
  # over UDP/514 or TCP/514 by admin choice.
  - name: pri
    type: fixed
    value: 14

  - name: rfc3164_ts
    type: datetime
    format: "%b %d %H:%M:%S"

  # ─── CEF `rt` extension format — ArcSight canonical "MMM dd yyyy HH:mm:ss"
  # (ArcSight Console User's Guide CEF date format). Used for both `rt`
  # (Device Receipt Time ← eventTime) and `deviceCustomDate1`
  # (Device Custom Date 1 ← userIdentity.sessionContext.attributes.creationDate).
  - name: cef_rt
    type: datetime
    format: "%b %d %Y %H:%M:%S"

  - name: cef_session_date
    type: datetime
    format: "%b %d %Y %H:%M:%S"

  # eventID GUID — emitted as `deviceExternalId` (Device Payload ID per
  # SmartConnector PDF page 25 maps to `eventid`; the CEF spec slot for
  # a payload-style unique id is `deviceExternalId`).
  - name: event_id
    type: faker
    method: uuid4

  # 6 weighted scenarios mirror the native sibling exactly so detection
  # rules pivoting on `act=` (CEF) and `eventName` (JSON) hit on the
  # same scenario mix.
  - name: scenario
    type: weighted_choice
    choices:
      get_caller_identity:  0.30
      list_access_keys:     0.20
      assume_role:          0.20
      describe_instances:   0.15
      get_secret_value:     0.10
      list_buckets:         0.05

  - name: source_ip
    type: weighted_choice
    choices:
      "83.142.209.203": 0.5
      "83.142.209.11":  0.3
      "46.151.182.203": 0.2

  # User-Agent strings — emitted as `requestClientApplication` per
  # SmartConnector PDF page 26 (Request Client Application ← userAgent).
  # Python-urllib/3.12 is the Datadog advisory's named IOC.
  - name: user_agent
    type: weighted_choice
    choices:
      "aws-cli/2.15.0 Python/3.11.7 Linux/5.15.0-92-generic source/x86_64.ubuntu.22 prompt/off command/sts.get-caller-identity": 0.35
      "Boto3/1.34.0 md/Botocore#1.34.0 ua/2.0 os/linux#6.5.0 md/arch#x86_64 lang/python#3.12.1 cfg/retry-mode#standard Botocore/1.34.0": 0.30
      "Python-urllib/3.12": 0.35

  # eventName — CEF `name` header slot AND CEF `act` extension.
  # SmartConnector PDF page 25: Name ← EventName. Also serves as
  # Device Action since CloudTrail "action" semantics map onto the
  # API verb itself (no separate action column in CloudTrail).
  - name: event_name
    type: template
    template: |-
      {%- if scenario == 'get_caller_identity' -%}GetCallerIdentity
      {%- elif scenario == 'list_access_keys' -%}ListAccessKeys
      {%- elif scenario == 'assume_role' -%}AssumeRole
      {%- elif scenario == 'describe_instances' -%}DescribeInstances
      {%- elif scenario == 'get_secret_value' -%}GetSecretValue
      {%- else -%}ListBuckets
      {%- endif -%}

  # eventSource — CEF header `Device Product` slot AND CEF `dproc`
  # extension. SmartConnector PDF page 25: Device Product ← eventSource.
  # Multi-product Device Product header is unusual but documented;
  # legacy ArcSight content matches on eventSource directly in the
  # header rather than an extension.
  - name: event_source
    type: template
    template: |-
      {%- if scenario in ['get_caller_identity', 'assume_role'] -%}sts.amazonaws.com
      {%- elif scenario == 'list_access_keys' -%}iam.amazonaws.com
      {%- elif scenario == 'describe_instances' -%}ec2.amazonaws.com
      {%- elif scenario == 'get_secret_value' -%}secretsmanager.amazonaws.com
      {%- else -%}s3.amazonaws.com
      {%- endif -%}

  # Stolen access keys — emitted as `filePermission` per SmartConnector
  # PDF page 25 (File Permission ← userIdentity.accessKeyId). This
  # repurposing of `filePermission` is non-intuitive but is the
  # canonical SmartConnector map; downstream parsers and ArcSight ESM
  # content pivots on it for AWS API call attribution.
  - name: stolen_access_key
    type: weighted_choice
    choices:
      "AKIAIOSFODNN7EXAMPLE":   0.34
      "AKIAA4ZGZ52BNS6MFEXAM":  0.33
      "AKIAWJALRXUTNFEXAMPL":   0.33

  # principalId — emitted as `fileId` per SmartConnector PDF page 25
  # (File ID ← userIdentity.principalid). AIDA + 16 chars per IAM
  # unique-id convention; independent of accessKeyId.
  - name: principal_id
    type: weighted_choice
    choices:
      "AIDAJ45Q7YFFAREXAMPLE":  0.34
      "AIDA6ON6E4XEGIEXAMPLE":  0.33
      "AIDA6ON6E4XEGITEXAMPL":  0.33

  - name: error_code
    type: weighted_choice
    choices:
      "OK":                     0.70
      "AccessDenied":           0.15
      "InvalidClientTokenId":   0.10
      "ExpiredToken":           0.05

  # On success, SmartConnector populates Event Outcome=Success and
  # leaves Reason / Message extensions absent (matches PDF page 25:
  # Event Outcome ← one of (errorCode, ('Success','Failure'))).
  # On failure, Event Outcome=Failure, Reason=errorCode, Message=
  # errorMessage.
  - name: cef_outcome
    type: template
    template: "{% if error_code == 'OK' %}Success{% else %}Failure{% endif %}"

  - name: error_message
    type: template
    template: |-
      {%- if error_code == 'AccessDenied' -%}User: arn:aws:iam::{{params.aws_account_id}}:user/{{params.victim_iam}} is not authorized to perform: {{event_source|replace('.amazonaws.com','')}}:{{event_name}} on resource: *
      {%- elif error_code == 'InvalidClientTokenId' -%}The security token included in the request is invalid.
      {%- elif error_code == 'ExpiredToken' -%}The security token included in the request is expired
      {%- else -%}
      {%- endif -%}

  # eventType — emitted as `requestMethod` per SmartConnector PDF
  # page 26 (Request Method ← eventType). For our credential-abuse
  # scenarios this is always `AwsApiCall` (Management events).
  - name: event_type
    type: fixed
    value: "AwsApiCall"

  # Device Event Class ID per SmartConnector PDF page 25:
  # "All of(eventName, One of('|Success','|Failure'))".
  # The signature_id form is `<eventName>|<Outcome>` concatenated.
  # Used in the CEF header SignatureID slot.
  - name: signature_id
    type: template
    template: "{{event_name}}|{{cef_outcome}}"

  # CEF severity — ArcSight scale 0..10. SmartConnector default for
  # CloudTrail API success is sev 3 (Low/informational); failure
  # bumps to 5; AccessDenied to 7; key-validation failures to 8
  # (suspicious cred testing).
  - name: cef_severity
    type: template
    template: |-
      {%- if error_code == 'OK' -%}3
      {%- elif error_code == 'AccessDenied' -%}7
      {%- elif error_code in ['InvalidClientTokenId', 'ExpiredToken'] -%}8
      {%- else -%}5
      {%- endif -%}

  # MFA flag — emitted as `cs3` per SmartConnector PDF page 25
  # (Device Custom String 3 ← userIdentity.sessionContext.attributes.
  # mfaAuthenticated). Stolen long-term keys = MFA never asserted.
  - name: mfa_authenticated
    type: fixed
    value: "false"

# ──────────────────────────────────────────────────────────────────
# CEF wire template
# ──────────────────────────────────────────────────────────────────
# Strict ArcSight CEF spec layout:
#   CEF:Version|DeviceVendor|DeviceProduct|DeviceVersion|SignatureID|Name|Severity|Extension
#
# Extension key derivation (all from SmartConnector 8.4.3 PDF p25-26,
# COMMON "Amazon Web Services Mappings to ArcSight Fields" table —
# the SmartConnector applies this table to every CloudTrail event
# regardless of service):
#
#   act            ← eventName              (Device Action; SC populates
#                                            from CloudTrail eventName since
#                                            CloudTrail has no separate action
#                                            column. Note: PDF lists Device
#                                            Event Class ID, not Device Action,
#                                            but ArcSight ESM content commonly
#                                            also uses `act` for verb pivot.
#                                            See Open Questions § 1.)
#   outcome        ← Event Outcome          (PDF p25: one of (errorCode,
#                                            ('Success','Failure')))
#   src            ← sourceIPAddress        (PDF p26: Source Address)
#   suser          ← UserIdentity.UserName  (PDF p26: Source User Name)
#   suid           ← userIdentity.Accountid (PDF p26: Source User ID)
#   duid           ← recipientAccountid     (PDF p25: Destination User ID)
#   fileId         ← userIdentity.principalid     (PDF p25: File ID)
#   filePath       ← userIdentity.arn             (PDF p25: File Path)
#   filePermission ← userIdentity.accessKeyId     (PDF p25: File Permission)
#   fileType       ← userIdentity.Type            (PDF p25: File Type)
#   deviceExternalId ← eventid              (PDF p25: Device Payload ID —
#                                            CEF spec uses deviceExternalId
#                                            for unique device-side event id)
#   requestClientApplication ← userAgent    (PDF p26: Request Client Application)
#   requestMethod  ← eventType              (PDF p26: Request Method)
#   rt             ← eventTime              (PDF p25: Device Receipt Time)
#   deviceCustomDate1 ← userIdentity.sessionContext.attributes.creationDate
#                                            (PDF p25: Device Custom Date 1)
#   cfp1           ← eventVersion           (PDF p25: Device Custom Floating
#                                            Point 1)
#   cs1            ← requestParameters      (PDF p25: Device Custom String 1)
#   cs2            ← responseElements       (PDF p25: Device Custom String 2)
#   cs3            ← userIdentity.sessionContext.attributes.mfaAuthenticated
#                                            (PDF p25: Device Custom String 3)
#   cs4            ← awsRegion              (community convention; PDF p25
#                                            lists Device Domain ← awsRegion
#                                            which CEF spec routes through
#                                            `deviceDnsDomain`, but downstream
#                                            ArcSight content commonly puts
#                                            awsRegion in cs4 with explicit
#                                            label for ESM filtering. See
#                                            Open Questions § 2.)
#   dproc          ← eventSource            (community convention; we also
#                                            populate the CEF header
#                                            Device Product slot per PDF p25:
#                                            Device Product ← eventSource)
#
# CEF header values:
#   Version       = 0
#   Device Vendor = "Amazon"                (PDF p25: Device Vendor ← 'Amazon')
#   Device Product= eventSource              (PDF p25: Device Product ← eventSource)
#   Device Version= "1.11"                   (eventVersion — matches native sibling)
#   SignatureID   = "<eventName>|<Outcome>"  (PDF p25: Device Event Class ID
#                                             ← All of(eventName, One of(
#                                             '|Success','|Failure')))
#   Name          = eventName                (PDF p25: Name ← EventName)
#   Severity      = 3/5/7/8 by outcome       (community: PDF doesn't pin
#                                             severity; default SC behaviour
#                                             is informational unless failure)

template: |-
  <{{pri}}>{{rfc3164_ts}} {{params.sc_host}} CEF:0|Amazon|{{event_source}}|1.11|{{signature_id}}|{{event_name}}|{{cef_severity}}|act={{event_name}} outcome={{cef_outcome}} src={{source_ip}} suser={{params.victim_iam}} suid={{params.aws_account_id}} duid={{params.aws_account_id}} fileId={{principal_id}} filePath=arn:aws:iam::{{params.aws_account_id}}:user/{{params.victim_iam}} filePermission={{stolen_access_key}} fileType=IAMUser deviceExternalId={{event_id}} requestClientApplication={{user_agent}} requestMethod={{event_type}} rt={{cef_rt}} deviceCustomDate1={{cef_session_date}} deviceCustomDate1Label=SessionCreationDate cfp1=1.11 cfp1Label=EventVersion cs1=null cs1Label=RequestParameters cs2=null cs2Label=ResponseElements cs3={{mfa_authenticated}} cs3Label=MFAAuthenticated cs4={{params.aws_region}} cs4Label=AWSRegion dproc={{event_source}}{% if error_code != 'OK' %} reason={{error_code}} msg={{error_message}}{% endif %}
