vendor: owasp
product: modsecurity-crs
version: "4.x"
log_type: audit-json
description: |
  ModSecurity v3 (libmodsecurity) JSON audit log — one transaction per line,
  wire-format **audited 2026-05-15** against the upstream `Transaction::toJSON`
  source at github.com/owasp-modsecurity/ModSecurity src/transaction.cc#L1567.

  對齊 OWASP CRS 4.x rule fire 樣本,權重取自一份具代表性的多日期間
  audit log 流量分佈(representative distribution,非單一真實部署的逐筆重放)。

  三模式(--param mode=X):
    realistic (default) — 權重對齊 production 分佈;打 100 條長相像真實流量
    coverage            — 60 attack + 2 anomaly 均勻分佈;`--count 200+` 確保每條 ruleId 都至少 1 hit
    single              — `--param rule_id=NNNNNN` 鎖定一條 ruleId 反覆灌

  Sink:預設走 udp://192.0.2.18:514 餵 .18 ELK auto-route → modsec-audit-to-ecs ingest pipeline。
  也可直接 file:///path 收檔給 .202 filebeat sidecar tail 重放。

  Wire format key 順序(authoritative,from C++ source):
    transaction.{client_ip, time_stamp, server_id, client_port, host_ip,
                 host_port, unique_id, is_interrupted, request, response,
                 producer, messages}
    request.{method, http_version, hostname, uri, body?, headers}
    response.{body?, http_code, headers}
    producer.{modsecurity, connector, secrules_engine, components}
    messages[].{message, details.{match, reference, ruleId, file,
                lineNumber, data, severity, ver, rev, tags, maturity, accuracy}}

  ⚠️ v3 與 v2 (Apache mod_security2) JSON 格式 NOT 互通 — v2 用 `audit_data` 包裝
  且 messages 是 array of strings。此 catalog 是 v3 only。

format: json
transport: [udp_syslog, tcp_syslog, file, beats]

ocsf:
  class: web_resources_activity
  category_uid: 6
  class_uid: 6004

# ──────────────── DetectOps v2 metadata ────────────────
# ModSecurity audit log is the WAF's own detection stream — every line carries
# a CRS rule_id that already classified the event. Catalog stresses ELK ingest
# pipeline (modsec-audit-to-ecs) and confirms downstream Sigma/Kibana rules
# correlate WAF blocks with origin events. TBD: pending live-fire verification.
detections:
  wazuh:
    - decoder: modsecurity-nginx  # Wazuh modsec decoder family
      # rule_id varies by CRS PARANOIA level + attack class; each CRS rule
      # (e.g. 942100 SQLi) maps to its own Wazuh rule. Catalog mode=coverage
      # exercises all of them; mode=single targets one.
  sigma:
    - rule: web_modsec_attack_blocked
      ref: https://github.com/SigmaHQ/sigma/tree/master/rules/web
  elk_detection:
    - kibana_rule_id: waf-modsec-block-spike
      severity: medium

mythos_alignment:
  # R1 — WAF is the front-line; AI-generated exploits hit here first.
  # R4 — WAF block velocity is part of detection-velocity story.
  # PA9 — WAF logs are the deception baseline (real vs honeypot traffic).
  risk_refs: [R1, R4]
  pa_refs: [PA9]
  ttx_class: rapid

regression:
  # mode=coverage with --count 200 → ~200 alerts (every CRS hit fires Wazuh).
  # mode=realistic with --count 100 → ~100 alerts (production attack ratio).
  # Adjust per mode after first live-fire run.
  baseline_alert_count: 100
  baseline_ttd_ms: 3000

# ──────────────── v3: CTI provenance ────────────────
cti:
  source: owasp-modsecurity-source-code
  source_url: https://github.com/owasp-modsecurity/ModSecurity/blob/v3/master/src/transaction.cc#L1567
  advisory_id: ""
  ingested_at: "2026-05-15"
  related_campaign: ""

# ──────────────── v3: VulnOps reverse-lookup ────────────────
# ModSecurity itself is not a CVE-driven catalog — it's the detection plane.
# But upstream libmodsecurity / CRS upgrades can invalidate audit log shape,
# so flag the regression-critical bit so a libmodsecurity upgrade kicks P0.
vulnops:
  cve_refs: []
  affects:
    - vendor: owasp
      product: libmodsecurity
      version_range: ">=3.0.0,<4.0.0"
    - vendor: owasp
      product: coreruleset
      version_range: ">=4.0.0,<5.0.0"
  patch_signal:
    - libmodsecurity 3.x → 4.x bump
    - CRS major version bump (4.x → 5.x)
  regression_critical: true

params:
  # ─── mode switch ───
  mode:
    default: realistic        # realistic | coverage | single
  rule_id:
    default: "942100"         # 只在 single mode 用

  # ─── runtime version pins (representative of a real production deployment) ───
  modsecurity_version:
    default: "ModSecurity v3.0.14 (Linux)"
  connector_version:
    default: "ModSecurity-nginx v1.0.4"
  crs_version:
    default: "OWASP_CRS/4.25.0"   # representative production 版本;升 4.26 時改這欄
  secrules_engine:
    default: "DetectionOnly"      # Enabled | DetectionOnly | Disabled

  # ─── network pools ───
  src_cidr:
    default: "203.0.113.0/24"
  dst_ip:
