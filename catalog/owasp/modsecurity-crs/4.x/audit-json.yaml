fields:
  # ─── network ───
  - { name: client_ip,    type: cidr,      cidr: "${params.src_cidr}" }
  - { name: client_port,  type: int_range, min: 30000, max: 65000 }
  - { name: host_ip,      type: param,     param: dst_ip }
  - { name: host_port,    type: param,     param: dst_port }

  # ─── identifiers ───
  # time_stamp uses C %c format (locale-aware "Www Mmm dd hh:mm:ss yyyy" e.g.
  # "Fri May 15 12:34:56 2026") — matches libmodsecurity ascTime() output
  - { name: time_stamp,   type: datetime,  format: "%a %b %e %H:%M:%S %Y" }
  # server_id is yajl-internal uniqueId (utils::generate_transaction_unique_id);
  # typically observed as sha1-style hex in real audit logs. hex_16 is a close approximation.
  - { name: server_id,    type: faker,     method: sha1 }
  - { name: unique_id,    type: faker,     method: hex_16 }

  # ─── ruleId picker (mode-aware) ───
  - { name: rule_id_realistic, type: weighted_choice, choices: "${params.rule_pool_realistic}" }
  - { name: rule_id_coverage,  type: weighted_choice, choices: "${params.rule_pool_coverage}" }
  - name: rule_id
    type: template
    template: "{% if params.mode == 'single' %}{{ params.rule_id }}{% elif params.mode == 'coverage' %}{{ rule_id_coverage }}{% else %}{{ rule_id_realistic }}{% endif %}"

  # ─── http request ───
  - { name: method, type: weighted_choice, choices: { GET: 0.65, POST: 0.25, PUT: 0.05, DELETE: 0.03, OPTIONS: 0.02 } }
  # http_version is string in wire format ("1.1" or "2.0"), not numeric
  - { name: http_version, type: weighted_choice, choices: { "1.1": 0.6, "2.0": 0.4 } }
  - { name: host_header,  type: weighted_choice, choices: "${params.host_pool}" }
  - { name: user_agent,   type: weighted_choice, choices: "${params.ua_pool}" }

  # ─── attack picker (family-aware via ruleId) ───
  - name: uri
    type: template
    template: "{{ params.uri_pool[params.rule_meta[rule_id].family] | random }}"
  - name: data_excerpt
    type: template
    template: "{{ params.data_pool[params.rule_meta[rule_id].family] | random }}"

  # ─── response ───
  - { name: status, type: weighted_choice, choices: { "200": 0.85, "403": 0.10, "404": 0.05 } }

  # ─── anomaly score (5-70 typical for ModSec CRS in DetectionOnly) ───
  - { name: anomaly_score, type: int_range, min: 5, max: 70 }

  # ─── messages array (single-line JSON,whitespace control suppresses \n) ───
  # Tag set follows CRS 4.x rule definitions verbatim — most attack rules carry:
  #   application-multi / language-multi / platform-multi / attack-<family> /
  #   paranoia-level/1 / OWASP_CRS / capec/1000/152/248/66 / PCI/6.5.2
  # Anomaly rules (949/980) carry: modsecurity / anomaly-evaluation / OWASP_CRS
  - name: messages_json
    type: template
    template: |-
      {%- set meta = params.rule_meta[rule_id] -%}
      {%- set fam = meta.family -%}
      {%- set conf_file = '/etc/modsecurity.d/owasp-crs/rules/' + params.family_file[rule_id[:3]] -%}
      {%- if rule_id == '949110' -%}
      [{"message":"Inbound Anomaly Score Exceeded (Total Score: {{ anomaly_score }})","details":{"match":"Matched \"Operator `Ge' with parameter `5' against variable `TX:BLOCKING_INBOUND_ANOMALY_SCORE' (Value: `{{ anomaly_score }}' )","reference":"","ruleId":"949110","file":"{{ conf_file }}","lineNumber":"{{ meta.line }}","data":"","severity":"0","ver":"{{ params.crs_version }}","rev":"","tags":["modsecurity","anomaly-evaluation","OWASP_CRS"],"maturity":"0","accuracy":"0"}}]
      {%- elif rule_id == '980130' -%}
      [{"message":"{{ meta.msg }}","details":{"match":"Anomaly Score: {{ anomaly_score }}","reference":"","ruleId":"980130","file":"{{ conf_file }}","lineNumber":"{{ meta.line }}","data":"","severity":"0","ver":"{{ params.crs_version }}","rev":"","tags":["modsecurity","anomaly-evaluation","OWASP_CRS"],"maturity":"0","accuracy":"0"}}]
      {%- else -%}
      [{"message":"{{ meta.msg }}","details":{"match":"Matched payload","reference":"v9,12","ruleId":"{{ rule_id }}","file":"{{ conf_file }}","lineNumber":"{{ meta.line }}","data":"Matched Data: {{ data_excerpt }}","severity":"{{ meta.sev }}","ver":"{{ params.crs_version }}","rev":"","tags":["application-multi","language-multi","platform-multi","attack-{{ fam }}","paranoia-level/1","OWASP_CRS","capec/1000/152/248/66","PCI/6.5.2"],"maturity":"0","accuracy":"0"}},{"message":"Inbound Anomaly Score Exceeded (Total Score: {{ anomaly_score }})","details":{"match":"Matched \"Operator `Ge' with parameter `5' against variable `TX:BLOCKING_INBOUND_ANOMALY_SCORE' (Value: `{{ anomaly_score }}' )","reference":"","ruleId":"949110","file":"/etc/modsecurity.d/owasp-crs/rules/REQUEST-949-BLOCKING-EVALUATION.conf","lineNumber":"222","data":"","severity":"0","ver":"{{ params.crs_version }}","rev":"","tags":["modsecurity","anomaly-evaluation","OWASP_CRS"],"maturity":"0","accuracy":"0"}}]
      {%- endif -%}

# Wire format (single-line JSON, key order matches libmodsecurity yajl output):
#   transaction → request → response → producer → messages
# http_version, http_code, client_port, host_port are NUMERIC types; everything else is string.
# is_interrupted is BOOLEAN.
template: '{"transaction":{"client_ip":"{{client_ip}}","time_stamp":"{{time_stamp}}","server_id":"{{server_id}}","client_port":{{client_port}},"host_ip":"{{host_ip}}","host_port":{{host_port}},"unique_id":"{{unique_id}}","is_interrupted":false,"request":{"method":"{{method}}","http_version":"{{http_version}}","hostname":"{{host_header}}","uri":"{{uri}}","headers":{"Host":"{{host_header}}","User-Agent":"{{user_agent}}","Accept":"*/*"}},"response":{"http_code":{{status}},"headers":{"Content-Type":"text/html","Server":"nginx/1.28.2"}},"producer":{"modsecurity":"{{params.modsecurity_version}}","connector":"{{params.connector_version}}","secrules_engine":"{{params.secrules_engine}}","components":["{{params.crs_version}}"]},"messages":{{messages_json}}}}'
